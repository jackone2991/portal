  # ── People registry (SPEC-08) ────────────────────────────────────────────
  /people:
    get:
      tags: [people]
      summary: List the caller's people (cursor, ordered by name)
      operationId: listPeople
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - name: circle
          in: query
          required: false
          description: Restrict to one section. Omit for every circle.
          schema: { $ref: "#/components/schemas/PersonCircle" }
      responses:
        "200":
          description: A cursor page of people
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people: { type: array, items: { $ref: "#/components/schemas/Person" } }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [people]
      summary: Add a person
      operationId: createPerson
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PersonWrite" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Person" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /connections:
    get:
      tags: [social]
      summary: The caller's connections, or the requests waiting either way
      description: |
        `status=accepted` (default) lists people you are connected to;
        `incoming` lists requests waiting on your answer; `outgoing` lists ones
        you sent that nobody has answered.

        Every row is rendered from the caller's point of view: `user_id` and
        `display_name` are always the OTHER person, and `outgoing` says which
        side asked — the difference between a Cancel button and an Accept one.
      operationId: listConnections
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [accepted, incoming, outgoing], default: accepted }
      responses:
        "200":
          description: Connections from the caller's point of view
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [social]
      summary: Ask someone to connect
      description: |
        Sends a pending request. If that person has already asked you, this
        accepts theirs instead of failing — sending a request to someone who
        asked you first is agreement, and answering "already exists" would leave
        their request sitting unanswered.
      operationId: requestConnection
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        "201": { description: Request sent (or theirs accepted), content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`social/connection-exists` — already connected, or a request is pending either way"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        "422":
          description: "`social/cannot-connect-to-self`"
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  /connections/summary:
    get:
      tags: [social]
      summary: How many requests are waiting on the caller
      description: Backs the header badge. Counts pending requests addressed to the caller.
      operationId: connectionSummary
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pending-incoming count
          content:
            application/json:
              schema:
                type: object
                required: [incoming]
                properties:
                  incoming: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /connections/{id}/accept:
    post:
      tags: [social]
      summary: Accept a pending request
      description: |
        Only the addressee can accept, enforced by the `0037` UPDATE policy
        rather than a check in the handler. A request that is not yours to
        answer is reported as 404: the policies hide it, so confirming it exists
        would be the only way to learn that it does.
      operationId: acceptConnection
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Connected, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /connections/{id}:
    delete:
      tags: [social]
      summary: Withdraw, decline, or disconnect
      description: |
        One operation for all three, because the row means the same thing in
        every case: this link no longer exists. Either party may call it, at any
        stage. A declined request is deleted rather than recorded, so the pair is
        free to try again later.
      operationId: removeConnection
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Gone }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /people/suggestions:
    get:
      tags: [people]
      summary: People you may know (other accounts on this instance)
      description: |
        Accounts on this Portal that the caller has not added to their registry
        yet — the source of the rail's third section.

        Names and ids only. The people module reaches the account roster through
        account's `api/` package and subtracts its own `linked_user_id`s in Go;
        there is no join across the module boundary.

        Only approved, non-disabled accounts appear, and never the caller.
        Returns an empty list on a binary with no directory wired.
      operationId: listPeopleSuggestions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Accounts not yet in the registry
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [user_id, display_name]
                      properties:
                        user_id: { type: string, format: uuid }
                        display_name: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /people/upcoming-birthdays:
    get:
