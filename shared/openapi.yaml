                  upcoming: { type: array, items: { $ref: "#/components/schemas/UpcomingBirthday" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /people/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [people]
      summary: Fetch one person (404 for others' rows)
