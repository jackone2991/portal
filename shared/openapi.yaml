openapi: 3.1.0
info:
  title: Portal API
  version: 0.1.0
  description: |
    Portal — self-hosted media platform API.

    This document is the **source of truth** for the HTTP contract.
    Server stubs (Go) and the TypeScript client are both generated from it.

    ## Errors

    Error responses use the **RFC 7807** `application/problem+json` shape
    (`#/components/schemas/Problem`), and that is the only error shape on the
    wire. The stable `type` URI is both the i18n key and the machine-stable
    slug: a domain code becomes `<module>/<code>` with underscores hyphenated
    (`email_taken` → `account/email-taken`), which is what the frontend's
    problem catalog keys on. Transport-level codes that add nothing to the
    status line (`unauthorized`, `forbidden`, `bad_request`, `internal`,
    `not_found`) collapse to `about:blank`.

    > **Migration status (v1):** the RFC 7807 retrofit per [D-7]/[D-29] is
    > **complete** — every handler, the auth/RBAC middleware, the rate limiter
    > and the `/continue` route now answer with `Problem`. The legacy
    > `{code, message}` body (`#/components/schemas/Error`) is emitted nowhere
    > and referenced by no operation; the schema is kept `deprecated` so a
    > generated client that still names the type keeps compiling, and should be
    > dropped at the next breaking release.

    Auth is **local password** ([ADR-06](../docs/adr/06-local-auth-model.md));
    the OIDC/Authentik login + `/auth/callback` flow was removed.

servers:
  # Every path below is written WITHOUT the `/api/v1` prefix, so the prefix
  # belongs here — `cmd/api` mounts the whole surface under `r.Route("/api/v1")`.
  # (`/healthz` is additionally exposed at the root for container probes; the
  # `/api/v1` copy is the same handler.) Getting this wrong makes "Try it out"
  # in any spec viewer hit a 404 on everything.
  - url: https://api.portal.localhost/api/v1
    description: Local dev (via Traefik)
  - url: http://localhost:8080/api/v1
    description: Direct (no proxy)

tags:
  - name: health
  - name: auth
  - name: admin
  - name: layout
  - name: assets
  - name: notifications
  - name: ops
  - name: movies
  - name: music
  - name: stories
  - name: comic
  - name: comic-internal
  - name: tenant
  - name: platform

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A dependency (DB or cache) is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      tags: [auth]
      summary: Local password login
      description: |
        Verifies `email` + `password` against `users.password_hash` (Argon2id,
        constant-time). On success, mints an access JWT + refresh token, sets the
        `portal_access` / `portal_refresh` / `portal_session` cookies, and returns
        the access token in the body for API clients. Brute-force attempts are
        rate-limited per IP and per account (429).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; cookies set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Credentials were correct but the account may not hold a session:
            `account/account-disabled` (switched off), `account/account-pending`
            (registration not approved yet) or `account/account-rejected` (refused;
            `detail` carries the reviewer's note when there is one).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/register:
    post:
      tags: [auth]
      summary: Create a local account
      description: |
        Creates a local account (Argon2id hash) and seeds the default `user`
        role. Returns **201 without a session**.

        The account is born **pending** (migration 0031): the password works, but
        `/auth/login` refuses it with 403 `account/account-pending` until a holder
        of `users:approve` — `superadmin` by default — approves it. Read
        `approval_status` on the response to decide what to tell the user.

        **First-run exception:** if this is the very first account on the install
        it is approved immediately and granted `superadmin`, because otherwise a
        fresh deployment deadlocks with nobody able to approve anybody.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created (no session issued)
          content:
            application/json:
              schema:
                type: object
                required: [status, email, approval_status]
                properties:
                  status: { type: string, enum: [registered] }
                  email:  { type: string, format: email }
                  approval_status:
                    allOf:
                      - $ref: "#/components/schemas/ApprovalStatus"
                    description: |
                      `pending` for everyone but the founding account, which comes
                      back `approved` and can sign in at once.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token, mint new access token
      description: |
        Reads the refresh token from the `portal_refresh` cookie (browser) or the
        `refresh_token` body field (API client). Rotates the token (old is
        revoked, new is issued) and returns a fresh access token. Reuse of an
        already-rotated token revokes the entire chain (token theft) and emits an
        `account.refresh.reuse_detected` audit event.
      operationId: refreshToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke current session and bump token_version
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204": { description: Logged out }

  /auth/logout-all:
    post:
      tags: [auth]
      summary: Revoke every session for the current user
      description: |
        Revokes all refresh tokens and bumps `users.token_version`,
        invalidating any access tokens already in flight.
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        "204": { description: All sessions revoked }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [auth]
      summary: Get the currently authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user (with role codes for UI gating)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password-reset email (SPEC-04 P0.3)
      description: |
        Enumeration-safe: always returns **202** whether or not the email is
        registered, and responds before the lookup/mint/enqueue so timing does
        not leak account existence. On success (registered, enabled, not
        throttled) a single-use reset token is minted and a `notify:dispatch`
        (`account.password_reset`, email channel) is enqueued. Per-email
        (≥60s gap, ≤3/h) and per-IP throttles apply; the per-IP limit answers
        429 (revealing nothing about any email). Account-owned; unblocked by SPEC-04.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Accepted (always, regardless of whether the email exists)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Consume a reset token and set a new password (SPEC-04 P0.3)
      description: |
        Verifies the one-time reset token (SHA-256 hash lookup, constant-time),
        sets the new Argon2id password, bumps `token_version` and revokes all
        refresh tokens (every session is revoked, ADR-06), then consumes the
        token. Expired / used / unknown tokens — and tokens for a since-disabled
        user — return **400** `account/invalid-reset-token`; a too-short password
        returns **400** `account/password-policy`.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated (all sessions revoked)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [password_updated] }
        "400":
          description: Invalid/expired/used reset token, or weak password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Admin console ────────────────────────────────────────────────────────
  # Registration is approve-first (migration 0031): /auth/register creates a
  # PENDING account whose password works but whose login is refused until a
  # holder of `users:approve` decides. That permission is granted to no role by
  # default, so `superadmin` — which holds the `*` wildcard — is the only role
  # that can approve out of the box.
  #
  # Every mutation here also enforces two rules that are not visible in the
  # shapes below: you cannot edit your own roles/approval/enabled state, and you
  # cannot grant or revoke a permission you do not hold yourself. Both answer
  # 403 `account/escalation` or `account/self-target`.

  /admin/users:
    get:
      tags: [admin]
      summary: List user accounts
      description: |
        The user directory and the approval queue are the same list under
        different `status` filters. Always returns `counts` so the UI can badge
        the pending queue without a second call. Requires `users:read:any`.
      operationId: adminListUsers
      parameters:
        - name: status
          in: query
          description: Restrict to one approval state. Omit for every state.
          schema: { $ref: "#/components/schemas/ApprovalStatus" }
        - name: q
          in: query
          description: Case-insensitive substring match on email or display name.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of accounts, plus per-state totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [admin]
      summary: Provision an account directly
      description: |
        Creates an account without a registration. Requires `users:write:any`.

        **The approval state is not yours to choose.** It comes from the
        creator's own authority: a creator who holds `users:approve` gets a
        usable account at once, one who does not gets a `pending` row that still
        has to clear the queue. Otherwise this endpoint would be a way around the
        approval gate for anybody with `users:write:any`.

        Roles are not settable here — assign them afterwards with
        `PUT /admin/users/{id}/roles`, so the no-escalation rule lives in one
        place. The new account is seeded with the `user` role only.

        A password is required rather than optional: an account with no
        credential can neither sign in nor recover itself.
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateUserRequest" }
      responses:
        "201":
          description: The new account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An account with this email already exists (`account/email-taken`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      summary: One user account
      description: Requires `users:read:any`.
      operationId: adminGetUser
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [admin]
      summary: Edit an account
      description: |
        Changes the email, the display name, or sets a new password. Requires
        `users:write:any`. Omitted or empty fields are left alone.

        Email is editable because it IS the login identifier, which also makes
        editing an account that outranks you a takeover route — refused with 403
        `account/escalation`. Editing **yourself** is allowed here, unlike roles
        and approval: renaming yourself locks nobody out.

        Setting a password revokes every session the old one issued — the
        `token_version` bump kills access tokens and the refresh chain is burned,
        so the browser cannot silently mint new ones.
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateUserRequest" }
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Another account already uses that email (`account/email-taken`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [admin]
      summary: Delete an account permanently
      description: |
        Requires `users:delete:any`.

        **This cascades.** Every foreign key to `users` is `ON DELETE CASCADE`,
        so the account's assets, comics, movies, tracks, stories, ledger, journal
        entries, people and organizations go with it. There is no undo, and the
        database will not object. `POST /admin/users/{id}/disable` is the
        reversible alternative and is what the UI leads with.

        `confirm_email` must equal the target's email (case-insensitive). That is
        enforced server-side, not just in the UI, so a misclick, a stale tab or a
        replayed request cannot reach the DELETE.

        Also refused when: the target is you (403 `account/self-target`); the
        target holds permissions you do not (403 `account/escalation`); or it is
        the last account able to approve registrations, which would leave signups
        that nobody can ever let in (409 `account/last-approver`).
      operationId: adminDeleteUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDeleteUserRequest" }
      responses:
        "204": { description: Deleted, along with everything the account owned }
        "400":
          description: The confirmation did not match (`account/confirmation-mismatch`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Would leave nobody able to approve registrations (`account/last-approver`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /admin/users/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Approve a pending registration
      description: |
        Lets the account sign in. Requires `users:approve`. Approving yourself is
        refused (403 `account/self-target`).
      operationId: adminApproveUser
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Refuse a registration
      description: |
        The row is kept rather than deleted, so the same email cannot be
        re-registered to get past the refusal, and `note` is shown back to the
        person on their next login attempt. Requires `users:approve`.
      operationId: adminRejectUser
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}/revoke-approval:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Send an approved account back to pending
      description: |
        Bumps `token_version`, so any session the account currently holds stops
        verifying on its next request. Requires `users:approve`.
      operationId: adminRevokeApproval
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}/disable:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Disable an account
      description: Requires `users:write:any`. Disabling yourself is refused.
      operationId: adminDisableUser
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}/enable:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Re-enable a disabled account
      description: Requires `users:write:any`.
      operationId: adminEnableUser
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users/{id}/roles:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: Replace a user's roles
      description: |
        Whole-set replacement, not add/remove, so a checkbox column saves as one
        atomic decision. Requires `rbac:role:assign`; refused with 403
        `account/escalation` if any role being added *or* removed carries a
        permission the caller does not hold, and always refused on yourself.
      operationId: adminSetUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleAssignment" }
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/permission-matrix:
    get:
      tags: [admin]
      summary: The whole role x permission grid
      description: |
        Every role (with its parent), every permission in the catalog, and per
        role both `direct` grants and the full `effective` set after the
        hierarchy walk. The two differ on purpose: a direct grant is a checkbox
        you can clear, an inherited one is a consequence of the parent chain and
        is changed by editing the ancestor. Requires `rbac:role:read`.
      operationId: adminPermissionMatrix
      responses:
        "200":
          description: Roles and permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionMatrix" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/roles:
    post:
      tags: [admin]
      summary: Create a role
      description: Requires `rbac:role:write`.
      operationId: adminCreateRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: The new role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/roles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      summary: Edit a role
      description: |
        `code` is immutable — grants, seed data and the escalation guard all key
        on it. System roles are refused (403 `account/role-protected`), and a
        parent that would close a cycle is refused (400 `account/role-cycle`).
        Requires `rbac:role:write`.
      operationId: adminUpdateRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: The updated role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      summary: Delete a role
      description: |
        Refused for system roles, for roles still assigned to somebody, and for
        roles another role inherits from. Requires `rbac:role:write`.
      operationId: adminDeleteRole
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/roles/{id}/permissions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: Replace a role's direct permissions
      description: |
        Saves one row of the matrix atomically and returns the whole recomputed
        matrix, because changing one role's grants changes every descendant's
        `effective` set. Everyone holding the role — or any role inheriting from
        it — has `token_version` bumped, which re-keys the permission cache;
        their session survives on the refresh cookie. Requires `rbac:role:write`,
        and the no-escalation rule applies to both added and removed codes.
      operationId: adminSetRolePermissions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolePermissionAssignment" }
      responses:
        "200":
          description: The recomputed matrix
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionMatrix" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Shell layout ─────────────────────────────────────────────────────────
  # The navigation menu and the dashboard widget rails, which used to be
  # hardcoded arrays in the React bundle (migration 0036). The module stores
  # placement and visibility only: a widget `key` points at a component in the
  # frontend registry, and a menu row is a link.

  /layout:
    get:
      tags: [layout]
      summary: The shell layout for the calling user
      description: |
        Menu entries and dashboard widgets this caller should actually see —
        `visible` rows whose `permission` they hold, already filtered.

        Authenticated but NOT permission-gated: the app frame cannot render
        without it, so a gate here would only mean nobody has a sidebar. The
        filtering is server-side rather than in the client, so an admin-only
        entry does not merely get hidden in a bundle anyone can read.
      operationId: getMyLayout
      responses:
        "200":
          description: The caller's menu and widgets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/layout:
    get:
      tags: [layout]
      summary: The whole layout, hidden rows included
      description: Requires `system:settings:write`.
      operationId: adminGetLayout
      responses:
        "200":
          description: Every menu entry and widget, in position order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/layout/menu:
    put:
      tags: [layout]
      summary: Replace the whole navigation menu
      description: |
        Whole-set rather than per-row: reordering is the common edit, and a
        sequence of per-row updates would leave the menu in intermediate orders
        that another admin could load. Applied in one transaction.

        **Array order is authoritative** — `position` is renumbered from it, so
        two rows can never claim the same slot.

        Rows absent from the payload are deleted, EXCEPT `is_system` ones: those
        are the shell's own navigation, and a stale tab must not be able to empty
        the menu into a state nobody can fix from inside the UI. `href` must be an
        in-app path starting with a single `/` — an absolute URL would turn the
        app's own navigation into an open-redirect surface every user sees.

        Requires `system:settings:write`.
      operationId: adminSaveLayoutMenu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LayoutMenuSaveRequest" }
      responses:
        "200":
          description: The saved layout, re-read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutConfig" }
        "400":
          description: |
            Validation failed (`layout/validation`). `detail` names the offending
            row, because an admin editing fifteen entries needs to know which one.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/layout/widgets:
    put:
      tags: [layout]
      summary: Replace dashboard widget placement
      description: |
        Sets slot, order, label, permission and visibility for the widgets that
        already exist. It never creates or deletes one: `key` has to match a
        React component in the frontend registry, so the catalogue is fixed by
        the bundle and only placement is data. An unknown key is refused with
        `layout/unknown-widget` rather than stored as a hole in the dashboard.

        `position` is renumbered per slot from array order, so moving a card
        between rails does not carry a number over from the rail it left.

        Requires `system:settings:write`.
      operationId: adminSaveLayoutWidgets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LayoutWidgetsSaveRequest" }
      responses:
        "200":
          description: The saved layout, re-read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutConfig" }
        "400":
          description: Validation failed, or an unknown widget key (`layout/unknown-widget`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /me/notifications:
    get:
      tags: [notifications]
      summary: List the caller's notifications (SPEC-04 P0.1)
      description: |
        Newest first (`created_at DESC, id DESC`), cursor-paginated.
        `status=unread` restricts to unread rows; default (`all`) returns
        read+unread. Always includes `unread_count` for the bell badge.
        Requires `notifications:read:own`.
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [all, unread], default: all }
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a prior page's `next_cursor`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Notifications page + unread badge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /me/notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark one notification read (idempotent)
      description: |
        Idempotent, owner-scoped. Requires `notifications:write:own`. A notification
        id belonging to another user (or missing) returns 404 — it never leaks
        existence.
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Marked read; returns the fresh unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such notification for this user (`notify/notification-not-found`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark all notifications read, optionally up to a watermark
      description: |
        Marks unread rows at/older than the `before` watermark read (absent =
        all). The watermark is the `(created_at, id)` cursor of the newest
        rendered item, so rows that arrived after the dropdown rendered stay
        unread. Idempotent. Requires `notifications:write:own`.
      operationId: markAllNotificationsRead
      security:
        - bearerAuth: []
      parameters:
        - name: before
          in: query
          required: false
          description: Keyset watermark cursor; absent marks all unread read.
          schema: { type: string }
      responses:
        "200":
          description: Returns the fresh unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /assets:
    get:
      tags: [assets]
      summary: List the caller's assets
      operationId: listAssets
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Filter by asset kind.
          schema: { type: string, enum: [video, image, audio] }
        - name: status
          in: query
          required: false
          description: Filter by status; `processing` includes still-`uploading` sessions.
          schema: { type: string, enum: [ready, processing, failed] }
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a prior page's `next_cursor`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: The caller's assets (cursor-paginated, newest first)
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Asset"
                  next_cursor:
                    type: string
                    nullable: true
                    description: Keyset cursor for the next page; absent/null on the last page.
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [assets]
      summary: Begin a media upload
      description: |
        Creates the asset row and returns a **presigned PUT** for the original
        bytes. The browser PUTs directly to object storage (prod/R2); in dev it
        may proxy through `PUT /assets/{id}/source`. Then call
        `POST /assets/{id}/complete` to enqueue transcoding.
      operationId: createAssetUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetUploadSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /assets/{id}:
    get:
      tags: [assets]
      summary: Get asset metadata
      operationId: getAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: Asset (includes `hlsUrl` once status is `ready`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [assets]
      summary: Update an asset (visibility)
      description: |
        Changes the mutable parts of an asset. Today that is `visibility` alone —
        the switch between owner-only and readable by anyone with the link.

        Restricted to the owner or an admin of the owning tenant, and enforced by
        the `0032` UPDATE policy rather than by a check in the handler. Someone
        else's asset is therefore reported as 404, never 403: the endpoint must
        not confirm that an id exists.
      operationId: patchAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility:
                  $ref: "#/components/schemas/AssetVisibility"
      responses:
        "200":
          description: The updated asset
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset:
                    $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`media/invalid-visibility` — not one of `private` / `public`"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [assets]
      summary: Delete an asset (owner, or `assets:delete:any`)
      description: |
        Soft-deletes (`status='deleting'`, hidden from listings) then purges the
        asset's storage objects (original, HLS, variants) and rows. Enforced via
        `RequireOwnerOrPermission`. Idempotent — an already-gone asset returns 404.
      operationId: deleteAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "204": { description: Deleted }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/source:
    put:
      tags: [assets]
      summary: API-proxied upload of the original bytes (dev path)
      description: |
        Streams the raw original into object storage via the API. Used in dev
        where the presigned PUT endpoint is not browser-reachable; prod uploads
        go straight to the presigned URL from `POST /assets`. Body is the raw
        file; `Content-Type` is the media type.
      operationId: uploadAssetSource
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204": { description: Stored }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/complete:
    post:
      tags: [assets]
      summary: Confirm the upload and enqueue processing
      description: |
        Marks the source uploaded and enqueues a transcode (video) or thumbnail
        (image) job on Asynq. Asset status transitions to `processing` and
        eventually `ready` or `failed`.
      operationId: completeAssetUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "202":
          description: Processing started
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [processing] }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Source upload is not complete
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: File exceeds the 50 MB limit — object deleted, asset `failed`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Unsupported format (e.g. HEIC) — object deleted, asset `failed`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /assets/{id}/original:
    get:
      tags: [assets]
      summary: Download the original file (owner-only)
      description: |
        Streams the source object inline with the sniffed content type.
        Owner-authenticated only — the original retains full EXIF/GPS (unlike the
        metadata-stripped variants), so it is never served through the public-ish
        variant/HLS scheme.

        **Range requests are supported** and this is load-bearing, not a nicety:
        it is the route an `<audio>`/`<video>` element plays from, and a browser
        that cannot range-request its media source reports `seekable` as `[0,0]`
        and silently refuses every scrub. Served via `http.ServeContent`, so
        `Accept-Ranges: bytes` is always present and a `Range` header is answered
        with `206` + `Content-Range`.
      operationId: downloadAssetOriginal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
        - name: Range
          in: header
          required: false
          description: Byte range, e.g. `bytes=0-1023`. Answered with `206`.
          schema: { type: string }
      responses:
        "200":
          description: The whole original, inline
          headers:
            Accept-Ranges:
              description: Always `bytes` — what makes the source seekable.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: The requested byte range
          headers:
            Content-Range:
              description: e.g. `bytes 0-1023/5242880`
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "416":
          description: The requested range lies outside the object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Asset still uploading — source may be partial
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /assets/{id}/variants/{variant}:
    get:
      tags: [assets]
      summary: Stream a derived variant (public-ish)
      description: |
        Serves a metadata-stripped WebP variant (`thumb`/`medium`/`poster`). Same
        public stance as the HLS proxy — variants carry no EXIF, so they are safe
        to be semi-public; the private original is behind `/assets/{id}/original`.
      operationId: getAssetVariant
      parameters:
        - $ref: "#/components/parameters/AssetID"
        - name: variant
          in: path
          required: true
          schema: { type: string, enum: [thumb, medium, poster] }
      responses:
        "200":
          description: The variant image
          content:
            image/webp: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/hls/{path}:
    get:
      tags: [assets]
      summary: Public HLS proxy (manifest + segments)
      description: |
        Serves the HLS master/variant manifests and media segments for a `ready`
        asset. **Public** (no bearer) so the `<video>`/Vidstack player can fetch
        segments directly; access to the asset id is the capability.
      operationId: getAssetHLS
      parameters:
        - $ref: "#/components/parameters/AssetID"
        - name: path
          in: path
          required: true
          description: Manifest or segment path under the asset's HLS output prefix.
          schema: { type: string }
      responses:
        "200":
          description: HLS manifest or media segment
          content:
            application/vnd.apple.mpegurl: {}
            video/mp2t: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/progress:
    get:
      tags: [assets]
      summary: Fetch playback progress
      operationId: getAssetProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: Progress details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [assets]
      summary: Save playback progress
      operationId: putAssetProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position_ms]
              properties:
                position_ms:
                  type: integer
                  minimum: 0
      responses:
        "204":
          description: Progress saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /continue:
    get:
      tags: [assets]
      summary: List active progress items across modules (SPEC-07)
      description: |
        Returns the unified "Continue Watching/Reading" rail for the current user.
      operationId: getContinueItems
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: The continue items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContinueItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /journal/entries:
    post:
      tags: [journal]
      summary: Create a journal entry
      operationId: createJournalEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryWrite"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Validation failed (`journal/invalid-body` · `journal/invalid-mood` · `journal/invalid-asset`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      tags: [journal]
      summary: List the caller's journal entries (newest occurred_at first)
      operationId: listJournalEntries
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a prior page's next_cursor.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: A cursor page of entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/JournalEntry"
                  next_cursor:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /journal/entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [journal]
      summary: Fetch one journal entry
      operationId: getJournalEntry
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found (missing or owned by another user)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      tags: [journal]
      summary: Partially update a journal entry
      operationId: patchJournalEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryWrite"
      responses:
        "200":
          description: The updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [journal]
      summary: Delete a journal entry (idempotent)
      operationId: deleteJournalEntry
      security:
        - bearerAuth: []
      responses:
        "204": { description: Deleted }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ops/status:
    get:
      tags: [ops]
      summary: Backup freshness sentinel (admin)
      description: |
        Reports whether the nightly Postgres backup is healthy (SPEC-09 P0.5).
        `state` precedence, first match wins: `failed` (most recent completed run
        failed) → `stale` (no success within 26 h, including never-ran, where
        `last_success_at` and `hours_since_success` are null) → `ok`. A `running`
        run is not completed and never changes `state`.
      operationId: getOpsStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Backup freshness status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Bank / personal ledger (SPEC-03) ─────────────────────────────────────
  # Money fields are integer minor units end-to-end (D-41). Every route is
  # owner-scoped: a foreign id resolves to 404 (existence never leaks).
  /bank/accounts:
    get:
      tags: [bank]
      summary: List the caller's accounts with derived balances
      operationId: listBankAccounts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's accounts
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/BankAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [bank]
      summary: Create an account
      operationId: createBankAccount
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountCreate" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /bank/accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [bank]
      summary: Update an account (name / archived / currency)
      description: currency is immutable once the account has transactions (`bank/account-not-mutable`).
      operationId: updateBankAccount
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountPatch" }
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [bank]
      summary: Delete an empty account
      description: Accounts with transactions cannot be deleted, only archived (`bank/account-not-empty`).
      operationId: deleteBankAccount
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /bank/categories:
    get:
      tags: [bank]
      summary: List the caller's own + seed categories
      operationId: listBankCategories
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Own + seed categories
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/BankCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [bank]
      summary: Create a category
      operationId: createBankCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankCategoryCreate" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /bank/categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [bank]
      summary: Update a category (name / parent)
      description: kind is immutable; re-parenting re-runs the top-level + same-kind checks (`bank/invalid-category-parent`). Seeds are not mutable (404).
      operationId: updateBankCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankCategoryPatch" }
      responses:
        "200":
          description: The updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [bank]
      summary: Delete a category (optionally reassigning its transactions)
      description: Without `reassign_to`, a category with transactions returns 409 `bank/category-in-use`. Seeds are undeletable (404). Children promote to top level; budgets cascade.
      operationId: deleteBankCategory
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reassign_to
          in: query
          required: false
          description: Move this category's transactions to the target (own or seed, same kind) before deleting.
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /bank/transactions:
    get:
      tags: [bank]
      summary: List transactions (cursor paged, newest first)
      operationId: listBankTransactions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: account, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: category, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: month, in: query, required: false, description: "YYYY-MM", schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: A cursor page of transactions
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items: { $ref: "#/components/schemas/BankTransaction" }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [bank]
      summary: Create a manual transaction
      operationId: createBankTransaction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransactionCreate" }
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /bank/transactions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [bank]
      summary: Update a transaction
      description: A transfer leg cannot be edited here (409 `bank/is-transfer-leg`) — use /bank/transfers/{transfer_id}.
      operationId: updateBankTransaction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransactionPatch" }
      responses:
        "200":
          description: The updated transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [bank]
      summary: Delete a transaction
      description: A transfer leg cannot be deleted here (409 `bank/is-transfer-leg`).
      operationId: deleteBankTransaction
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /bank/transfers:
    post:
      tags: [bank]
      summary: Create an inter-account transfer (paired debit + credit)
      operationId: createBankTransfer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransferCreate" }
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransfer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /bank/transfers/{transfer_id}:
    parameters:
      - { name: transfer_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [bank]
      summary: Update both legs of a transfer atomically
      operationId: updateBankTransfer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransferPatch" }
      responses:
        "200":
          description: The updated transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransfer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [bank]
      summary: Delete a transfer (both legs) atomically
      operationId: deleteBankTransfer
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bank/budgets:
    get:
      tags: [bank]
      summary: List monthly budgets with spent (tree, incl. children)
      operationId: listBankBudgets
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, required: false, description: "YYYY-MM (default current month)", schema: { type: string } }
      responses:
        "200":
          description: Budget lines for the month
          content:
            application/json:
              schema:
                type: object
                required: [month, budgets]
                properties:
                  month: { type: string }
                  budgets:
                    type: array
                    items: { $ref: "#/components/schemas/BankBudgetLine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [bank]
      summary: Upsert a monthly budget (amount 0 or null deletes it)
      operationId: setBankBudget
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankBudgetWrite" }
      responses:
        "204": { description: Upserted or deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /bank/dashboard:
    get:
      tags: [bank]
      summary: Ledger dashboard (balances, month flow, budgets, recent)
      operationId: getBankDashboard
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, required: false, description: "YYYY-MM (default current month)", schema: { type: string } }
      responses:
        "200":
          description: The dashboard aggregate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bank/report:
    get:
      tags: [bank]
      summary: Month report — category breakdown and trailing trend
      description: |
        The month screen's aggregate. `expenses` / `incomes` are per-category
        totals with CHILD categories rolled up into their parent, sorted by
        total descending — a breakdown that split "Cà phê" out of "Ăn uống"
        would be a chart of slivers.

        Pure transfer legs are excluded (moving money between your own wallets
        is not spending), but a transfer FEE — a row with both `transfer_id` and
        `category_id` — counts as an ordinary expense.

        `trend` always contains a fixed window of months ending at the requested
        one, including months with no activity as zero rows.
      operationId: getBankReport
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, required: false, description: "YYYY-MM (default current month)", schema: { type: string } }
      responses:
        "200":
          description: The month report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Comic vertical (SPEC-02) ─────────────────────────────────────────────
  # Published-or-owner reads (a draft is 404 to others); owner-or-elevated
  # mutations (RequireOwnerOrPermission). Page/cover assets are ready images.
  /comics:
    get:
      tags: [comic]
      summary: List published comics (cursor)
      operationId: listComics
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 30 } }
      responses:
        "200":
          description: A cursor page of published comics
          content:
            application/json:
              schema:
                type: object
                required: [comics]
                properties:
                  comics: { type: array, items: { $ref: "#/components/schemas/Comic" } }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [comic]
      summary: Create a comic
      operationId: createComic
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ComicCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Comic" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /comics/mine:
    get:
      tags: [comic]
      summary: List the caller's own comics (incl. drafts)
      operationId: listMyComics
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The caller's comics
          content:
            application/json:
              schema:
                type: object
                required: [comics]
                properties:
                  comics: { type: array, items: { $ref: "#/components/schemas/Comic" } }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /comics/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [comic]
      summary: Comic detail (chapters + progress); draft is 404 to non-owners
      operationId: getComic
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The comic, content: { application/json: { schema: { $ref: "#/components/schemas/ComicDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [comic]
      summary: Update a comic (owner or comics:write:any)
      operationId: updateComic
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ComicPatch" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Comic" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [comic]
      summary: Delete a comic (owner or comics:delete:any)
      operationId: deleteComic
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /comics/{id}/publish:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [comic]
      summary: Publish (≥1 chapter, every chapter ≥1 page)
      operationId: publishComic
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/Comic" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Not publishable (`comic/not-publishable`) — lists offending chapters
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /comics/{id}/unpublish:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [comic]
      summary: Unpublish (back to draft)
      operationId: unpublishComic
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Unpublished, content: { application/json: { schema: { $ref: "#/components/schemas/Comic" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /comics/{id}/chapters:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [comic]
      summary: Add a chapter
      operationId: createChapter
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChapterCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Chapter" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /comics/{id}/chapters:order:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      tags: [comic]
      summary: Reorder chapters (full ordered id list)
      operationId: reorderChapters
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReorderRequest" } } }
      responses:
        "204": { description: Reordered }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /comics/{id}/progress:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      tags: [comic]
      summary: Save reading progress (keyed by page_id)
      operationId: saveComicProgress
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProgressWrite" } } }
      responses:
        "204": { description: Saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /comics/{id}/sync-sources:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [comic]
      summary: List the comic's external sync sources (SPEC-02 P1.8)
      operationId: listSyncSources
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sources
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncSourceList" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [comic]
      summary: Bind an external source URL to the comic
      description: |
        The URL is SSRF-checked: it must be http(s), must match COMIC_SOURCE_ALLOWLIST
        when that is set, and must not resolve to a loopback, private, link-local,
        CGNAT or multicast address. Re-checked before every scrape.
      operationId: createSyncSource
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncSourceCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SyncSource" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Invalid or blocked source URL
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /sync-sources/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [comic]
      summary: Remove a sync source (owner-checked)
      operationId: deleteSyncSource
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sync-sources/{id}/sync:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [comic]
      summary: Start a scrape of the source (async; the scraper calls back)
      operationId: triggerSync
      security: [{ bearerAuth: [] }]
      responses:
        "202": { description: Sync accepted (the scraper works async and calls back), content: { application/json: { schema: { $ref: "#/components/schemas/SyncSource" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Already syncing, or the source URL no longer passes the SSRF check
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /sync-sources/{id}/cancel:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [comic]
      summary: Stop a running sync (chapters already imported are kept)
      operationId: cancelSync
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/SyncSource" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The source is not currently syncing, or the scraper refused the cancel
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /internal/comic/sync-batch:
    post:
      tags: [comic-internal]
      summary: Allocate an import job for one batch of scraped chapters
      operationId: syncBatch
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncBatchRequest" } } }
      responses:
        "200": { description: Batch allocated, content: { application/json: { schema: { $ref: "#/components/schemas/SyncBatchResponse" } } } }
        "400": { description: Malformed or missing source_id / owner_id }
        "401": { description: Bad or missing X-Internal-Secret }
        "404": { $ref: "#/components/responses/NotFound" }
  /internal/comic/sync-callback:
    post:
      tags: [comic-internal]
      summary: One batch's zip is uploaded (or that batch failed)
      operationId: syncCallback
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncCallbackRequest" } } }
      responses:
        "200": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { description: Malformed or missing import_id / owner_id }
        "401": { description: Bad or missing X-Internal-Secret }
  /internal/comic/sync-progress:
    post:
      tags: [comic-internal]
      summary: Report overall chapter progress for the source
      operationId: syncProgress
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncProgressRequest" } } }
      responses:
        "200": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { description: Malformed or missing source_id / owner_id }
        "401": { description: Bad or missing X-Internal-Secret }
  /internal/comic/sync-finalize:
    post:
      tags: [comic-internal]
      summary: Every batch is done — set the source's final status
      operationId: syncFinalize
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncFinalizeRequest" } } }
      responses:
        "200": { description: Finalized, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { description: Malformed or missing source_id / owner_id }
        "401": { description: Bad or missing X-Internal-Secret }
  /chapters/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [comic]
      summary: Update a chapter
      operationId: updateChapter
      security: [{ bearerAuth: [] }]
