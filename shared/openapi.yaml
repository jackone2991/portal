      responses:
        "200":
          description: A cursor page of the caller's stories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /stories/{id}:
    parameters: [{ $ref: "#/components/parameters/AssetID" }]
    get:
      tags: [stories]
      summary: Get one story with its chapter summaries
