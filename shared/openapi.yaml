openapi: 3.1.0
info:
  title: Portal API
  version: 0.1.0
  description: |
    Portal — self-hosted media platform API.

    This document is the **source of truth** for the HTTP contract.
    Server stubs (Go) and the TypeScript client are both generated from it.

    ## Errors

    Error responses use the **RFC 7807** `application/problem+json` shape
    (`#/components/schemas/Problem`). The stable `type` URI doubles as the i18n
    key; the `code` extension is a machine-stable slug (e.g. `invalid_credentials`).

    > **Migration note (v1):** RFC 7807 is the target contract per [D-7]/[D-29].
    > Some handlers still emit the legacy `{code, message}` body
    > (`#/components/schemas/Error`); they are retrofitted to `Problem` as they
    > are touched, not in a sweep (see ADR-01). Treat `Problem` as authoritative.

    Auth is **local password** ([ADR-06](../doc/en/architecture/06-local-auth-model.md));
    the OIDC/Authentik login + `/auth/callback` flow was removed.

servers:
  - url: https://api.portal.localhost
    description: Local dev (via Traefik)
  - url: http://localhost:8080
    description: Direct (no proxy)

tags:
  - name: health
  - name: auth
  - name: assets
  - name: notifications
  - name: ops
  - name: movies
  - name: music
  - name: stories
  - name: comic
  - name: comic-internal

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A dependency (DB or cache) is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      tags: [auth]
      summary: Local password login
      description: |
        Verifies `email` + `password` against `users.password_hash` (Argon2id,
        constant-time). On success, mints an access JWT + refresh token, sets the
        `portal_access` / `portal_refresh` / `portal_session` cookies, and returns
        the access token in the body for API clients. Brute-force attempts are
        rate-limited per IP and per account (429).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; cookies set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Account is disabled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/register:
    post:
      tags: [auth]
      summary: Create a local account
      description: |
        Creates a local account (Argon2id hash) and seeds the default `user`
        role. Returns **201 without a session** — the user is sent back to
        `/login` to sign in with the new credentials. Deployments that want
        invite-only signup gate this route at the router.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created (no session issued)
          content:
            application/json:
              schema:
                type: object
                required: [status, email]
                properties:
                  status: { type: string, enum: [registered] }
                  email:  { type: string, format: email }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token, mint new access token
      description: |
        Reads the refresh token from the `portal_refresh` cookie (browser) or the
        `refresh_token` body field (API client). Rotates the token (old is
        revoked, new is issued) and returns a fresh access token. Reuse of an
        already-rotated token revokes the entire chain (token theft) and emits an
        `account.refresh.reuse_detected` audit event.
      operationId: refreshToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke current session and bump token_version
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204": { description: Logged out }

  /auth/logout-all:
    post:
      tags: [auth]
      summary: Revoke every session for the current user
      description: |
        Revokes all refresh tokens and bumps `users.token_version`,
        invalidating any access tokens already in flight.
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        "204": { description: All sessions revoked }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [auth]
      summary: Get the currently authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user (with role codes for UI gating)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password-reset email (SPEC-04 P0.3)
      description: |
        Enumeration-safe: always returns **202** whether or not the email is
        registered, and responds before the lookup/mint/enqueue so timing does
        not leak account existence. On success (registered, enabled, not
        throttled) a single-use reset token is minted and a `notify:dispatch`
        (`account.password_reset`, email channel) is enqueued. Per-email
        (≥60s gap, ≤3/h) and per-IP throttles apply; the per-IP limit answers
        429 (revealing nothing about any email). Account-owned; unblocked by SPEC-04.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Accepted (always, regardless of whether the email exists)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Consume a reset token and set a new password (SPEC-04 P0.3)
      description: |
        Verifies the one-time reset token (SHA-256 hash lookup, constant-time),
        sets the new Argon2id password, bumps `token_version` and revokes all
        refresh tokens (every session is revoked, ADR-06), then consumes the
        token. Expired / used / unknown tokens — and tokens for a since-disabled
        user — return **400** `account/invalid-reset-token`; a too-short password
        returns **400** `account/password-policy`.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated (all sessions revoked)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [password_updated] }
        "400":
          description: Invalid/expired/used reset token, or weak password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /me/notifications:
    get:
      tags: [notifications]
      summary: List the caller's notifications (SPEC-04 P0.1)
      description: |
        Newest first (`created_at DESC, id DESC`), cursor-paginated.
        `status=unread` restricts to unread rows; default (`all`) returns
        read+unread. Always includes `unread_count` for the bell badge.
        Requires `notifications:read:own`.
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [all, unread], default: all }
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a prior page's `next_cursor`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Notifications page + unread badge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /me/notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark one notification read (idempotent)
      description: |
        Idempotent, owner-scoped. Requires `notifications:write:own`. A notification
        id belonging to another user (or missing) returns 404 — it never leaks
        existence.
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Marked read; returns the fresh unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such notification for this user (`notify/notification-not-found`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark all notifications read, optionally up to a watermark
      description: |
        Marks unread rows at/older than the `before` watermark read (absent =
        all). The watermark is the `(created_at, id)` cursor of the newest
        rendered item, so rows that arrived after the dropdown rendered stay
        unread. Idempotent. Requires `notifications:write:own`.
      operationId: markAllNotificationsRead
      security:
        - bearerAuth: []
      parameters:
        - name: before
          in: query
          required: false
          description: Keyset watermark cursor; absent marks all unread read.
          schema: { type: string }
      responses:
        "200":
          description: Returns the fresh unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /assets:
    get:
      tags: [assets]
      summary: List the caller's assets
      operationId: listAssets
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Filter by asset kind.
          schema: { type: string, enum: [video, image, audio] }
        - name: status
          in: query
          required: false
          description: Filter by status; `processing` includes still-`uploading` sessions.
          schema: { type: string, enum: [ready, processing, failed] }
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a prior page's `next_cursor`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: The caller's assets (cursor-paginated, newest first)
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Asset"
                  next_cursor:
                    type: string
                    nullable: true
                    description: Keyset cursor for the next page; absent/null on the last page.
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [assets]
      summary: Begin a media upload
      description: |
        Creates the asset row and returns a **presigned PUT** for the original
        bytes. The browser PUTs directly to object storage (prod/R2); in dev it
        may proxy through `PUT /assets/{id}/source`. Then call
        `POST /assets/{id}/complete` to enqueue transcoding.
      operationId: createAssetUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetUploadSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /assets/{id}:
    get:
      tags: [assets]
      summary: Get asset metadata
      operationId: getAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: Asset (includes `hlsUrl` once status is `ready`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [assets]
      summary: Delete an asset (owner, or `assets:delete:any`)
      description: |
        Soft-deletes (`status='deleting'`, hidden from listings) then purges the
        asset's storage objects (original, HLS, variants) and rows. Enforced via
        `RequireOwnerOrPermission`. Idempotent — an already-gone asset returns 404.
      operationId: deleteAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "204": { description: Deleted }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/source:
    put:
      tags: [assets]
      summary: API-proxied upload of the original bytes (dev path)
      description: |
        Streams the raw original into object storage via the API. Used in dev
        where the presigned PUT endpoint is not browser-reachable; prod uploads
        go straight to the presigned URL from `POST /assets`. Body is the raw
        file; `Content-Type` is the media type.
      operationId: uploadAssetSource
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204": { description: Stored }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/complete:
    post:
      tags: [assets]
      summary: Confirm the upload and enqueue processing
      description: |
        Marks the source uploaded and enqueues a transcode (video) or thumbnail
        (image) job on Asynq. Asset status transitions to `processing` and
        eventually `ready` or `failed`.
      operationId: completeAssetUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "202":
          description: Processing started
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [processing] }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Source upload is not complete
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: File exceeds the 50 MB limit — object deleted, asset `failed`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Unsupported format (e.g. HEIC) — object deleted, asset `failed`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /assets/{id}/original:
    get:
      tags: [assets]
      summary: Download the original file (owner-only)
      description: |
        Streams the source object as an attachment with the sniffed content type.
        Owner-authenticated only — the original retains full EXIF/GPS (unlike the
        metadata-stripped variants), so it is never served through the public-ish
        variant/HLS scheme.
      operationId: downloadAssetOriginal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: The original bytes (attachment)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Asset still uploading — source may be partial
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /assets/{id}/variants/{variant}:
    get:
      tags: [assets]
      summary: Stream a derived variant (public-ish)
      description: |
        Serves a metadata-stripped WebP variant (`thumb`/`medium`/`poster`). Same
        public stance as the HLS proxy — variants carry no EXIF, so they are safe
        to be semi-public; the private original is behind `/assets/{id}/original`.
      operationId: getAssetVariant
      parameters:
        - $ref: "#/components/parameters/AssetID"
        - name: variant
          in: path
          required: true
          schema: { type: string, enum: [thumb, medium, poster] }
      responses:
        "200":
          description: The variant image
          content:
            image/webp: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/hls/{path}:
    get:
      tags: [assets]
      summary: Public HLS proxy (manifest + segments)
      description: |
        Serves the HLS master/variant manifests and media segments for a `ready`
        asset. **Public** (no bearer) so the `<video>`/Vidstack player can fetch
        segments directly; access to the asset id is the capability.
      operationId: getAssetHLS
      parameters:
        - $ref: "#/components/parameters/AssetID"
        - name: path
          in: path
          required: true
          description: Manifest or segment path under the asset's HLS output prefix.
          schema: { type: string }
      responses:
        "200":
          description: HLS manifest or media segment
          content:
            application/vnd.apple.mpegurl: {}
            video/mp2t: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/progress:
    get:
      tags: [assets]
      summary: Fetch playback progress
      operationId: getAssetProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: Progress details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [assets]
      summary: Save playback progress
      operationId: putAssetProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position_ms]
              properties:
                position_ms:
                  type: integer
                  minimum: 0
      responses:
        "204":
          description: Progress saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /continue:
    get:
      tags: [assets]
      summary: List active progress items across modules (SPEC-07)
      description: |
        Returns the unified "Continue Watching/Reading" rail for the current user.
      operationId: getContinueItems
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: The continue items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContinueItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /journal/entries:
    post:
      tags: [journal]
      summary: Create a journal entry
      operationId: createJournalEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryWrite"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Validation failed (`journal/invalid-body` · `journal/invalid-mood` · `journal/invalid-asset`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      tags: [journal]
      summary: List the caller's journal entries (newest occurred_at first)
      operationId: listJournalEntries
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a prior page's next_cursor.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: A cursor page of entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/JournalEntry"
                  next_cursor:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /journal/entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [journal]
      summary: Fetch one journal entry
      operationId: getJournalEntry
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found (missing or owned by another user)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      tags: [journal]
      summary: Partially update a journal entry
      operationId: patchJournalEntry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryWrite"
      responses:
        "200":
          description: The updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [journal]
      summary: Delete a journal entry (idempotent)
      operationId: deleteJournalEntry
      security:
        - bearerAuth: []
      responses:
        "204": { description: Deleted }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ops/status:
    get:
      tags: [ops]
      summary: Backup freshness sentinel (admin)
      description: |
        Reports whether the nightly Postgres backup is healthy (SPEC-09 P0.5).
        `state` precedence, first match wins: `failed` (most recent completed run
        failed) → `stale` (no success within 26 h, including never-ran, where
        `last_success_at` and `hours_since_success` are null) → `ok`. A `running`
        run is not completed and never changes `state`.
      operationId: getOpsStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Backup freshness status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Bank / personal ledger (SPEC-03) ─────────────────────────────────────
  # Money fields are integer minor units end-to-end (D-41). Every route is
  # owner-scoped: a foreign id resolves to 404 (existence never leaks).
  /bank/accounts:
    get:
      tags: [bank]
      summary: List the caller's accounts with derived balances
      operationId: listBankAccounts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's accounts
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/BankAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [bank]
      summary: Create an account
      operationId: createBankAccount
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountCreate" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /bank/accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [bank]
      summary: Update an account (name / archived / currency)
      description: currency is immutable once the account has transactions (`bank/account-not-mutable`).
      operationId: updateBankAccount
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankAccountPatch" }
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [bank]
      summary: Delete an empty account
      description: Accounts with transactions cannot be deleted, only archived (`bank/account-not-empty`).
      operationId: deleteBankAccount
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /bank/categories:
    get:
      tags: [bank]
      summary: List the caller's own + seed categories
      operationId: listBankCategories
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Own + seed categories
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/BankCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [bank]
      summary: Create a category
      operationId: createBankCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankCategoryCreate" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /bank/categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [bank]
      summary: Update a category (name / parent)
      description: kind is immutable; re-parenting re-runs the top-level + same-kind checks (`bank/invalid-category-parent`). Seeds are not mutable (404).
      operationId: updateBankCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankCategoryPatch" }
      responses:
        "200":
          description: The updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [bank]
      summary: Delete a category (optionally reassigning its transactions)
      description: Without `reassign_to`, a category with transactions returns 409 `bank/category-in-use`. Seeds are undeletable (404). Children promote to top level; budgets cascade.
      operationId: deleteBankCategory
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reassign_to
          in: query
          required: false
          description: Move this category's transactions to the target (own or seed, same kind) before deleting.
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /bank/transactions:
    get:
      tags: [bank]
      summary: List transactions (cursor paged, newest first)
      operationId: listBankTransactions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: account, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: category, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: month, in: query, required: false, description: "YYYY-MM", schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: A cursor page of transactions
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items: { $ref: "#/components/schemas/BankTransaction" }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [bank]
      summary: Create a manual transaction
      operationId: createBankTransaction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransactionCreate" }
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /bank/transactions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [bank]
      summary: Update a transaction
      description: A transfer leg cannot be edited here (409 `bank/is-transfer-leg`) — use /bank/transfers/{transfer_id}.
      operationId: updateBankTransaction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransactionPatch" }
      responses:
        "200":
          description: The updated transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [bank]
      summary: Delete a transaction
      description: A transfer leg cannot be deleted here (409 `bank/is-transfer-leg`).
      operationId: deleteBankTransaction
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /bank/transfers:
    post:
      tags: [bank]
      summary: Create an inter-account transfer (paired debit + credit)
      operationId: createBankTransfer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransferCreate" }
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransfer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /bank/transfers/{transfer_id}:
    parameters:
      - { name: transfer_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [bank]
      summary: Update both legs of a transfer atomically
      operationId: updateBankTransfer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransferPatch" }
      responses:
        "200":
          description: The updated transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransfer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [bank]
      summary: Delete a transfer (both legs) atomically
      operationId: deleteBankTransfer
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bank/budgets:
    get:
      tags: [bank]
      summary: List monthly budgets with spent (tree, incl. children)
      operationId: listBankBudgets
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, required: false, description: "YYYY-MM (default current month)", schema: { type: string } }
      responses:
        "200":
          description: Budget lines for the month
          content:
            application/json:
              schema:
                type: object
                required: [month, budgets]
                properties:
                  month: { type: string }
                  budgets:
                    type: array
                    items: { $ref: "#/components/schemas/BankBudgetLine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [bank]
      summary: Upsert a monthly budget (amount 0 or null deletes it)
      operationId: setBankBudget
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankBudgetWrite" }
      responses:
        "204": { description: Upserted or deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /bank/dashboard:
    get:
      tags: [bank]
      summary: Ledger dashboard (balances, month flow, budgets, recent)
      operationId: getBankDashboard
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, required: false, description: "YYYY-MM (default current month)", schema: { type: string } }
      responses:
        "200":
          description: The dashboard aggregate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Comic vertical (SPEC-02) ─────────────────────────────────────────────
  # Published-or-owner reads (a draft is 404 to others); owner-or-elevated
  # mutations (RequireOwnerOrPermission). Page/cover assets are ready images.
  /comics:
    get:
      tags: [comic]
      summary: List published comics (cursor)
      operationId: listComics
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 30 } }
      responses:
        "200":
          description: A cursor page of published comics
          content:
            application/json:
              schema:
                type: object
                required: [comics]
                properties:
                  comics: { type: array, items: { $ref: "#/components/schemas/Comic" } }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [comic]
      summary: Create a comic
      operationId: createComic
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ComicCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Comic" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /comics/mine:
    get:
      tags: [comic]
      summary: List the caller's own comics (incl. drafts)
      operationId: listMyComics
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The caller's comics
          content:
            application/json:
              schema:
                type: object
                required: [comics]
                properties:
                  comics: { type: array, items: { $ref: "#/components/schemas/Comic" } }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /comics/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [comic]
      summary: Comic detail (chapters + progress); draft is 404 to non-owners
      operationId: getComic
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The comic, content: { application/json: { schema: { $ref: "#/components/schemas/ComicDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [comic]
      summary: Update a comic (owner or comics:write:any)
      operationId: updateComic
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ComicPatch" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Comic" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [comic]
      summary: Delete a comic (owner or comics:delete:any)
      operationId: deleteComic
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /comics/{id}/publish:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [comic]
      summary: Publish (≥1 chapter, every chapter ≥1 page)
      operationId: publishComic
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/Comic" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Not publishable (`comic/not-publishable`) — lists offending chapters
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /comics/{id}/unpublish:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [comic]
      summary: Unpublish (back to draft)
      operationId: unpublishComic
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Unpublished, content: { application/json: { schema: { $ref: "#/components/schemas/Comic" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /comics/{id}/chapters:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [comic]
      summary: Add a chapter
      operationId: createChapter
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChapterCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Chapter" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /comics/{id}/chapters:order:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      tags: [comic]
      summary: Reorder chapters (full ordered id list)
      operationId: reorderChapters
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReorderRequest" } } }
      responses:
        "204": { description: Reordered }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /comics/{id}/progress:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      tags: [comic]
      summary: Save reading progress (keyed by page_id)
      operationId: saveComicProgress
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProgressWrite" } } }
      responses:
        "204": { description: Saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /comics/{id}/sync-sources:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [comic]
      summary: List the comic's external sync sources (SPEC-02 P1.8)
      operationId: listSyncSources
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sources
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SyncSource" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [comic]
      summary: Bind an external source URL to the comic
      description: |
        The URL is SSRF-checked: it must be http(s), must match COMIC_SOURCE_ALLOWLIST
        when that is set, and must not resolve to a loopback, private, link-local,
        CGNAT or multicast address. Re-checked before every scrape.
      operationId: createSyncSource
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncSourceCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SyncSource" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Invalid or blocked source URL
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /sync-sources/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [comic]
      summary: Remove a sync source (owner-checked)
      operationId: deleteSyncSource
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sync-sources/{id}/sync:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [comic]
      summary: Start a scrape of the source (async; the scraper calls back)
      operationId: triggerSync
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Sync started, content: { application/json: { schema: { $ref: "#/components/schemas/SyncSource" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Already syncing, or the source URL no longer passes the SSRF check
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /sync-sources/{id}/cancel:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [comic]
      summary: Stop a running sync (chapters already imported are kept)
      operationId: cancelSync
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/SyncSource" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The source is not currently syncing, or the scraper refused the cancel
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /internal/comic/sync-batch:
    post:
      tags: [comic-internal]
      summary: Allocate an import job for one batch of scraped chapters
      operationId: syncBatch
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncBatchRequest" } } }
      responses:
        "200": { description: Batch allocated, content: { application/json: { schema: { $ref: "#/components/schemas/SyncBatchResponse" } } } }
        "400": { description: Malformed or missing source_id / owner_id }
        "401": { description: Bad or missing X-Internal-Secret }
        "404": { $ref: "#/components/responses/NotFound" }
  /internal/comic/sync-callback:
    post:
      tags: [comic-internal]
      summary: One batch's zip is uploaded (or that batch failed)
      operationId: syncCallback
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncCallbackRequest" } } }
      responses:
        "200": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { description: Malformed or missing import_id / owner_id }
        "401": { description: Bad or missing X-Internal-Secret }
  /internal/comic/sync-progress:
    post:
      tags: [comic-internal]
      summary: Report overall chapter progress for the source
      operationId: syncProgress
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncProgressRequest" } } }
      responses:
        "200": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { description: Malformed or missing source_id / owner_id }
        "401": { description: Bad or missing X-Internal-Secret }
  /internal/comic/sync-finalize:
    post:
      tags: [comic-internal]
      summary: Every batch is done — set the source's final status
      operationId: syncFinalize
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncFinalizeRequest" } } }
      responses:
        "200": { description: Finalized, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "400": { description: Malformed or missing source_id / owner_id }
        "401": { description: Bad or missing X-Internal-Secret }
  /chapters/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [comic]
      summary: Update a chapter
      operationId: updateChapter
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { title: { type: string } } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Chapter" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [comic]
      summary: Delete a chapter (pages cascade; assets untouched)
      operationId: deleteChapter
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /chapters/{id}/pages:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [comic]
      summary: Reader payload for a chapter (draft is 404 to non-owners)
      operationId: getChapterPages
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Ordered reader pages
          content:
            application/json:
              schema:
                type: object
                required: [pages]
                properties:
                  pages: { type: array, items: { $ref: "#/components/schemas/ReaderPage" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [comic]
      summary: Add pages (batch); each asset must be a ready image owned by the creator
      operationId: createPages
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PagesCreate" } } }
      responses:
        "201":
          description: Pages created
          content:
            application/json:
              schema: { type: object, required: [pages], properties: { pages: { type: array, items: { $ref: "#/components/schemas/Page" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /chapters/{id}/pages:order:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      tags: [comic]
      summary: Reorder pages (full ordered id list)
      operationId: reorderPages
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReorderRequest" } } }
      responses:
        "204": { description: Reordered }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /pages/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [comic]
      summary: Delete a page (row only; the media asset is untouched)
      operationId: deletePage
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── People registry (SPEC-08) ────────────────────────────────────────────
  /people:
    get:
      tags: [people]
      summary: List the caller's people (cursor, ordered by name)
      operationId: listPeople
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: A cursor page of people
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people: { type: array, items: { $ref: "#/components/schemas/Person" } }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [people]
      summary: Add a person
      operationId: createPerson
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PersonWrite" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Person" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /people/upcoming-birthdays:
    get:
      tags: [people]
      summary: Upcoming birthdays in the owner's timezone (soonest first)
      operationId: upcomingBirthdays
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 366, default: 14 } }
      responses:
        "200":
          description: Upcoming birthdays
          content:
            application/json:
              schema:
                type: object
                required: [upcoming]
                properties:
                  upcoming: { type: array, items: { $ref: "#/components/schemas/UpcomingBirthday" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /people/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [people]
      summary: Fetch one person (404 for others' rows)
      operationId: getPerson
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The person, content: { application/json: { schema: { $ref: "#/components/schemas/Person" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [people]
      summary: Update a person (birthday null clears; resets current/future notices)
      operationId: updatePerson
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PersonWrite" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Person" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [people]
      summary: Delete a person (idempotent)
      operationId: deletePerson
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Life-stream home (SPEC-06) ───────────────────────────────────────────
  /stream:
    get:
      tags: [stream]
      summary: The merged life-stream timeline (journal + system events)
      operationId: getStream
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 30 } }
      responses:
        "200":
          description: A cursor page of stream items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/StreamItem" } }
                  next_cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
      description: |
        Shared secret (COMIC_SYNC_SECRET) for service-to-service calls from the
        Python scraper. These endpoints carry no user session, which is why each
        one also takes owner_id — see the SPEC-02 P1.8 sync flow.

  parameters:
    AssetID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantSlug:
      name: tenant
      in: path
      required: true
      description: |
        Tenant slug for the `/t/{tenant}/…` prefix. `me` selects the caller's
        personal scope. Multi-tenant routing is deferred to Phase 1 (see
        `#/components/schemas/TenantContext`); v1 runs single-tenant.
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated, but lacks permission (or step-up required)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit / lockout tripped
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflicts with the resource's current state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    JournalEntry:
      type: object
      required: [id, body_md, asset_ids, occurred_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        body_md: { type: string }
        mood: { type: string, nullable: true }
        asset_ids:
          type: array
          items: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JournalEntryWrite:
      type: object
      description: |
        Create requires body_md; PATCH accepts any subset of the fields. `asset_ids`
        is rejected with 422 `journal/invalid-asset` until photo attachments (P1.5).
      properties:
        body_md: { type: string, minLength: 1, maxLength: 20000 }
        mood: { type: string, nullable: true, minLength: 1, maxLength: 80 }
        occurred_at:
          type: string
          format: date-time
          description: Optional; defaults to now. Backdating and future-dating are allowed.

    # ── Ops (SPEC-09) ───────────────────────────────────────────────────────
    OpsBackupRun:
      type: object
      description: One row of the backup-run ledger (`ops_backup_runs`).
      required: [id, status, started_at]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [running, ok, failed]
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        size_bytes: { type: integer, format: int64, nullable: true }
        storage_key: { type: string, nullable: true }
        error: { type: string, nullable: true }
    OpsStatus:
      type: object
      description: |
        Freshness sentinel for the nightly Postgres backup (P0.5). `last_success_at`
        and `hours_since_success` are both null when a backup has never succeeded.
      required: [state]
      properties:
        state:
          type: string
          enum: [ok, stale, failed]
          description: |
            `failed` (most recent completed run failed) → `stale` (no success within
            26 h, incl. never-ran) → `ok`. A running run never changes state.
        last_success_at:
          type: string
          format: date-time
          nullable: true
          description: Completion time of the most recent successful run; null if none.
        hours_since_success:
          type: number
          nullable: true
          description: Hours since the last success; null if none.
        last_run:
          allOf:
            - $ref: "#/components/schemas/OpsBackupRun"
          nullable: true
          description: The most recently started run of any status; null if none.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: boolean
        cache:
          type: boolean

    # ── Bank / personal ledger (SPEC-03) ────────────────────────────────────
    # All money fields are integer minor units (VND exponent 0, D-41).
    BankAccount:
      type: object
      required: [id, name, type, currency, opening_balance, balance, archived, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [cash, checking, savings, credit_card, ewallet, other] }
        currency: { type: string, description: ISO-4217, example: VND }
        opening_balance: { type: integer, format: int64 }
        balance: { type: integer, format: int64, description: Derived (opening + Σcredits − Σdebits); always current. }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
    BankAccountCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [cash, checking, savings, credit_card, ewallet, other] }
        currency: { type: string, default: VND }
        opening_balance: { type: integer, format: int64, default: 0 }
    BankAccountPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        archived: { type: boolean }
        currency: { type: string, description: Only mutable while the account is empty. }
    BankCategory:
      type: object
      required: [id, name, kind, seed]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        kind: { type: string, enum: [income, expense] }
        seed: { type: boolean, description: A user_id-NULL default (visible to all, mutable by none). }
    BankCategoryCreate:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [income, expense] }
        parent_id: { type: string, format: uuid, nullable: true, description: Must be a top-level category of the same kind. }
    BankCategoryPatch:
      type: object
      description: kind is immutable. `parent_id` present (incl. null) re-parents; absent leaves it.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parent_id: { type: string, format: uuid, nullable: true }
    BankTransaction:
      type: object
      required: [id, account_id, amount, direction, is_transfer, occurred_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, nullable: true }
        amount: { type: integer, format: int64, description: Strictly positive minor units. }
        direction: { type: string, enum: [debit, credit] }
        transfer_id: { type: string, format: uuid, nullable: true }
        is_transfer: { type: boolean, description: True for a transfer leg (transfer_id set AND category_id null). }
        occurred_at: { type: string, format: date, description: "YYYY-MM-DD" }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BankTransactionCreate:
      type: object
      required: [account_id, category_id, amount, direction]
      properties:
        account_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, description: Own or seed; kind must match direction. }
        amount: { type: integer, format: int64, minimum: 1 }
        direction: { type: string, enum: [debit, credit] }
        occurred_at: { type: string, format: date, description: Defaults to today. }
        note: { type: string, nullable: true }
    BankTransactionPatch:
      type: object
      properties:
        account_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1 }
        direction: { type: string, enum: [debit, credit] }
        occurred_at: { type: string, format: date }
        note: { type: string, nullable: true }
    BankTransferCreate:
      type: object
      required: [from_account, to_account, amount]
      properties:
        from_account: { type: string, format: uuid }
        to_account: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1 }
        occurred_at: { type: string, format: date }
        note: { type: string, nullable: true }
    BankTransferPatch:
      type: object
      properties:
        from_account: { type: string, format: uuid }
        to_account: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1 }
        occurred_at: { type: string, format: date }
        note: { type: string, nullable: true }
    BankTransfer:
      type: object
      required: [legs]
      properties:
        transfer_id: { type: string, format: uuid, nullable: true }
        legs:
          type: array
          items: { $ref: "#/components/schemas/BankTransaction" }
    BankBudgetLine:
      type: object
      required: [category_id, name, amount, spent]
      properties:
        category_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        parent_name: { type: string, nullable: true }
        amount: { type: integer, format: int64 }
        spent: { type: integer, format: int64, description: Σ expense debits this month incl. children, excl. transfer legs. }
    BankBudgetWrite:
      type: object
      required: [category_id, month]
      properties:
        category_id: { type: string, format: uuid, description: Must be expense-kind. }
        month: { type: string, description: "YYYY-MM" }
        amount: { type: integer, format: int64, nullable: true, description: 0 or null deletes the budget. }
    BankDashboard:
      type: object
      required: [month, accounts, income, expense, budgets, recent]
      properties:
        month: { type: string }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/BankAccount" }
        income: { type: integer, format: int64 }
        expense: { type: integer, format: int64 }
        budgets:
          type: array
          items: { $ref: "#/components/schemas/BankBudgetLine" }
        recent:
          type: array
          items: { $ref: "#/components/schemas/BankTransaction" }

    # ── Comic vertical (SPEC-02) ────────────────────────────────────────────
    SyncSource:
      type: object
      required: [id, comic_id, source_url, source_site, chapters_hint, last_status, total_chapters, scraped_chapters, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        comic_id: { type: string, format: uuid }
        source_url: { type: string, format: uri }
        source_site: { type: string, description: Host extracted from source_url }
        chapters_hint: { type: string, description: "Blank = all; an 'A-B' range, or explicit chapter URLs" }
        last_status:
          type: string
          enum: [idle, syncing, done, failed, cancelled]
        total_chapters: { type: integer, description: Chapters discovered at the source }
        scraped_chapters: { type: integer, description: Chapters scraped so far this run }
        last_import_id: { type: string, format: uuid, description: The batch import currently in flight }
        last_error: { type: string }
        last_synced_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SyncSourceCreate:
      type: object
      required: [source_url]
      properties:
        source_url: { type: string, format: uri, description: Must be http(s), allowlisted, and resolve to a public address }
        chapters_hint: { type: string }
    SyncBatchRequest:
      type: object
      required: [source_id, owner_id]
      properties:
        source_id: { type: string, format: uuid }
        owner_id:
          type: string
          format: uuid
          description: |
            The source owner, echoed back from the value the api handed the scraper.
            It supplies the tenant these session-less endpoints scope their writes to,
            and is verified against the row — a wrong value yields 404.
    SyncBatchResponse:
      type: object
      required: [import_id, upload_key]
      properties:
        import_id: { type: string, format: uuid }
        upload_key: { type: string, description: "Object key the batch zip must be uploaded to (import/{import_id}.zip)" }
    SyncCallbackRequest:
      type: object
      required: [import_id, owner_id, ok]
      properties:
        import_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid, description: See SyncBatchRequest.owner_id }
        ok: { type: boolean, description: false fails that batch's import job }
        error: { type: string }
    SyncProgressRequest:
      type: object
      required: [source_id, owner_id, scraped, total]
      properties:
        source_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid, description: See SyncBatchRequest.owner_id }
        scraped: { type: integer }
        total: { type: integer }
    SyncFinalizeRequest:
      type: object
      required: [source_id, owner_id, ok]
      properties:
        source_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid, description: See SyncBatchRequest.owner_id }
        ok: { type: boolean }
        failed: { type: string, description: Summary of chapters that failed, shown on the source row }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    Comic:
      type: object
      required: [id, owner_id, title, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        cover_asset_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [draft, published] }
        reading_direction: { type: string, enum: [ltr, rtl, vertical], default: vertical, description: "Reading direction of the work (manga = rtl). Drives the reader's paged navigation order and default mode." }
        chapter_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ComicDetail:
      allOf:
        - $ref: "#/components/schemas/Comic"
        - type: object
          properties:
            chapters: { type: array, items: { $ref: "#/components/schemas/Chapter" } }
            progress: { $ref: "#/components/schemas/ComicProgress" }
    ComicCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        cover_asset_id: { type: string, format: uuid, nullable: true, description: A ready image asset you own. }
    ComicPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        reading_direction: { type: string, enum: [ltr, rtl, vertical] }
        cover_asset_id: { type: string, format: uuid, nullable: true }
    Chapter:
      type: object
      required: [id, comic_id, title, sort_order, created_at]
      properties:
        id: { type: string, format: uuid }
        comic_id: { type: string, format: uuid }
        title: { type: string }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
    ChapterCreate:
      type: object
      required: [title, sort_order]
      properties:
        title: { type: string }
        sort_order: { type: integer }
    Page:
      type: object
      required: [id, chapter_id, asset_id, sort_order]
      properties:
        id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        sort_order: { type: integer }
    PagesCreate:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items:
            type: object
            required: [asset_id, sort_order]
            properties:
              asset_id: { type: string, format: uuid }
              sort_order: { type: integer }
    ReaderPage:
      type: object
      required: [page_id, asset_id]
      properties:
        page_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid, description: "Render the medium variant (GET /assets/ID/variants/medium)." }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
    ComicProgress:
      type: object
      required: [chapter_id, updated_at]
      properties:
        chapter_id: { type: string, format: uuid }
        page_id: { type: string, format: uuid, nullable: true }
        updated_at: { type: string, format: date-time }
    ProgressWrite:
      type: object
      required: [chapter_id]
      properties:
        chapter_id: { type: string, format: uuid }
        page_id: { type: string, format: uuid, nullable: true }
    ReorderRequest:
      type: object
      required: [order]
      properties:
        order:
          type: array
          items: { type: string, format: uuid }

    # ── People registry (SPEC-08) ───────────────────────────────────────────
    Birthday:
      type: object
      required: [month, day]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
        year: { type: integer, nullable: true, description: Optional — many people won't share a year. }
        calendar: { type: string, enum: [solar, lunar], default: solar }
    Person:
      type: object
      required: [id, display_name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        relationship: { type: string, nullable: true }
        birthday:
          allOf: [{ $ref: "#/components/schemas/Birthday" }]
          nullable: true
        contact: { type: object, additionalProperties: true }
        note_md: { type: string, nullable: true }
        avatar_asset_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PersonWrite:
      type: object
      description: "POST requires display_name; PATCH accepts any subset. A birthday of null clears it."
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        relationship: { type: string, nullable: true }
        birthday:
          allOf: [{ $ref: "#/components/schemas/Birthday" }]
          nullable: true
        contact: { type: object, additionalProperties: true }
        note_md: { type: string, nullable: true }
    UpcomingBirthday:
      type: object
      required: [person_id, display_name, next_occurrence, days_until]
      properties:
        person_id: { type: string, format: uuid }
        display_name: { type: string }
        next_occurrence: { type: string, format: date }
        days_until: { type: integer }
        age_turning: { type: integer, nullable: true }

    # ── Life-stream home (SPEC-06) ──────────────────────────────────────────
    StreamItem:
      type: object
      description: "One merged-timeline card. Journal items carry body_md/mood; system items a synthesized title/href."
      required: [id, source_module, event_type, occurred_at]
      properties:
        id: { type: string, format: uuid }
        source_module: { type: string, description: "journal | media | bank | comic | people" }
        event_type: { type: string }
        occurred_at: { type: string, format: date-time }
        body_md: { type: string, nullable: true }
        mood: { type: string, nullable: true }
        title: { type: string, nullable: true }
        href: { type: string, nullable: true }

    # ── RFC 7807 error contract (D-7 / D-29) ────────────────────────────────
    Problem:
      type: object
      description: |
        RFC 7807 problem detail, served as `application/problem+json`. `type` is a
        stable URI (also the i18n key); Portal adds the extensions below.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: "about:blank"
          description: Stable problem-type URI (i18n key).
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code, repeated for convenience.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri
          description: URI reference identifying the specific occurrence.
        code:
          type: string
          description: Portal-stable machine slug (e.g. `invalid_credentials`).
        required_acr:
          type: string
          description: For step-up (403) — the ACR the caller must satisfy [D-27].
        enrollment_url:
          type: string
          format: uri
          description: For MFA-enrollment (403) — where to enroll a second factor [D-28].
      additionalProperties: true

    # Legacy error body still emitted by un-migrated handlers. Superseded by
    # Problem; kept for reference during the RFC 7807 migration (see info.description).
    Error:
      deprecated: true
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    # ── Auth ────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password }
        remember:
          type: boolean
          default: false
          description: Persist the session (durable refresh cookie) vs a session cookie.

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        display_name:
          type: string
          description: Optional; defaults to the email local-part.

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:        { type: string, description: The one-time reset token from the email link. }
        new_password: { type: string, format: password, minLength: 8 }

    AccessToken:
      type: object
      required: [access_token, expires_in, token_type]
      properties:
        access_token: { type: string }
        expires_in:   { type: integer, description: "seconds until expiry" }
        token_type:   { type: string, enum: [Bearer] }

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/AccessToken"
        - type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id, email, display_name, roles]
              properties:
                id:           { type: string, format: uuid }
                email:        { type: string, format: email }
                display_name: { type: string }
                roles:
                  type: array
                  items: { type: string }

    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true

    CurrentUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [roles]
          properties:
            roles:
              type: array
              description: Role codes (e.g. ["user","creator"]). Frontend uses these to render UI affordances; the server is the authority on perm checks.
              items:
                type: string

    # ── Media ───────────────────────────────────────────────────────────────
    AssetKind:
      type: string
      enum: [video, audio, image]

    AssetStatus:
      type: string
      enum: [uploaded, processing, ready, failed]

    Asset:
      type: object
      required: [id, status, kind, mimeType, sizeBytes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AssetStatus"
        kind:
          $ref: "#/components/schemas/AssetKind"
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        durationMs:
          type: integer
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        hlsUrl:
          type: string
          format: uri
          nullable: true
          description: Master playlist URL; present once `status` is `ready`.
        error:
          type: string
          nullable: true
          description: Failure reason; present when `status` is `failed`.
        createdAt:
          type: string
          format: date-time

    CreateAssetRequest:
      type: object
      required: [filename, sizeBytes]
      properties:
        filename:
          type: string
        contentType:
          type: string
          default: application/octet-stream
        sizeBytes:
          type: integer
          format: int64

    AssetUploadSession:
      type: object
      required: [asset, upload]
      properties:
        asset:
          $ref: "#/components/schemas/Asset"
        upload:
          type: object
          required: [url, method]
          description: Presigned request the client performs to store the original.
          properties:
            url:    { type: string, format: uri }
            method: { type: string, enum: [PUT] }
            headers:
              type: object
              additionalProperties: { type: string }

    # ── Notifications (SPEC-04) ─────────────────────────────────────────────
    Notification:
      type: object
      required: [id, type, title, data, read_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Open type registry (e.g. `media.asset_ready`). See notify/README.md.
        title:
          type: string
        body:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Target ids / links — e.g. `href` for the bell's click-through.
        read_at:
          type: string
          format: date-time
          nullable: true
          description: When the notification was marked read; null while unread.
        created_at:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [items, unread_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unread_count:
          type: integer
          description: Unread badge count for the bell.
        next_cursor:
          type: string
          nullable: true
          description: Keyset cursor for the next page; absent/null on the last page.

    UnreadCount:
      type: object
      required: [unread_count]
      properties:
        unread_count:
          type: integer

    # ── Cross-module schemas (eager, per D-29) ──────────────────────────────
    # Defined ahead of the modules that need them so the contract is stable when
    # bank / tenant / the domain verticals land. Not all are referenced yet.
    Money:
      type: object
      description: Exact monetary amount [D-14/D-15]. `amount` is a decimal string to avoid float error.
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal string, e.g. "1234.56" (numeric(20,8) at rest).
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
        currency:
          type: string
          description: ISO 4217 code, e.g. "USD".
          minLength: 3
          maxLength: 3

    PaginatedResult:
      type: object
      description: |
        Cursor-paginated envelope. Concrete endpoints override `items` with their
        element type (OpenAPI has no generics — compose with `allOf` + an `items`
        override, or document the element type in the operation).
      required: [items]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null on the last page.
        total:
          type: integer
          nullable: true
          description: Total count when cheap to compute; otherwise omitted.

    TenantContext:
      type: object
      description: |
        Resolved tenant scope for the `/t/{tenant}/…` prefix [D-23]. Multi-tenancy
        is deferred to Phase 1; v1 runs single-tenant (`me`).
      required: [tenantId, slug]
      properties:
        tenantId:
          type: string
          format: uuid
        slug:
          type: string
        kind:
          type: string
          enum: [org, household]

    PlaybackProgress:
      type: object
      required: [position_ms, updated_at]
      properties:
        position_ms: { type: integer, format: int64 }
        progress_pct:
          type: integer
          description: Fractional completion 0..100. Absent if duration is unknown.
        completed_at:
          type: string
          format: date-time
          nullable: true
        updated_at: { type: string, format: date-time }

    ContinueItem:
      type: object
      description: |
        One "continue watching / reading / listening" entry for the cross-domain
        `/continue` rail [D-20]. Aggregated from each vertical's progress table.
      required: [module, ref_id, title, progress_pct, href, updated_at]
      properties:
        module:
          type: string
          enum: [media, movie, music, story, comic]
        ref_id:
          type: string
          format: uuid
        title:
          type: string
        progress_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: Fractional completion 0..100.
        href:
          type: string
        poster_url:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
