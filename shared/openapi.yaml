  # ══ Comic zip import (SPEC-02 P1.7) ═══════════════════════════════════════
  # Live since the P1.7 increment, unspecced until 2026-08-25.

  /comics/{id}/imports:
    parameters: [{ $ref: "#/components/parameters/AssetID" }]
    post:
      tags: [comic]
      summary: Start a whole-comic (multi-chapter) zip import
      description: |
        Allocates an import job and returns an `upload_ref` to PUT the zip to.
        Chapter structure is taken from the zip's top-level directories; a
        chapter's `sort_order` is parsed from its NAME, never from arrival
        order — see `chapterSortOrder` in the comic module.
      operationId: createComicImport
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: The created import job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /chapters/{id}/imports:
    parameters: [{ $ref: "#/components/parameters/AssetID" }]
    post:
      tags: [comic]
      summary: Start a single-chapter zip import
      description: Every image in the zip becomes a page of this chapter, ordered naturally by filename.
      operationId: createChapterImport
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: The created import job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /imports/{id}:
    parameters: [{ $ref: "#/components/parameters/AssetID" }]
    get:
      tags: [comic]
      summary: Poll an import job
      description: |
        `status` walks `pending → uploaded → running → done | failed`. `report`
        carries a per-entry result once the job has run.
      operationId: getImport
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The import job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /imports/{id}/zip:
    parameters: [{ $ref: "#/components/parameters/AssetID" }]
    put:
      tags: [comic]
      summary: Upload the import zip
      description: |
        Raw `application/zip` body, capped server-side. Completing the upload
        enqueues `comic:import_zip` on the default queue — deliberately NOT the
        heavy pool, because the job polls the asset statuses its own
        `media:process_image` tasks produce and must not occupy a slot they need.
      operationId: uploadImportZip
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        "202":
          description: Accepted — the import job is queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/UnprocessableEntity" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ══ Tenancy + platform ════════════════════════════════════════════════════

  /me/organizations:
    get:
      tags: [tenant]
      summary: The tenants the caller belongs to
      description: |
        At v1 every user has exactly one `personal` organization, created on
        first tenant resolution. Multi-org membership is ADR-07 step 5 and is
        deliberately deferred — see docs/guides/rls-cutover.md.
      operationId: listMyOrganizations
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's organizations
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations: { type: array, items: { $ref: "#/components/schemas/Organization" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /time:
    get:
      tags: [platform]
      summary: Server clock and the app display timezone
      description: |
        The single source of truth for "now" in the UI. The frontend's date
        helpers read it rather than the browser clock so a wrong client clock
        cannot shift a journal entry into the wrong day. Unauthenticated.
      operationId: getServerTime
      responses:
        "200":
          description: The current server time
          content:
            application/json:
              schema:
                type: object
                required: [now, timezone]
                properties:
                  now: { type: string, format: date-time, description: "Server time, UTC, RFC3339." }
                  timezone: { type: string, description: "IANA zone for ALL date display, e.g. Asia/Ho_Chi_Minh (APP_TIMEZONE)." }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
      description: |
        Shared secret (COMIC_SYNC_SECRET) for service-to-service calls from the
        Python scraper. These endpoints carry no user session, which is why each
        one also takes owner_id — see the SPEC-02 P1.8 sync flow.

  parameters:
    AssetID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantSlug:
      name: tenant
      in: path
      required: true
      description: |
        Tenant slug for the `/t/{tenant}/…` prefix. `me` selects the caller's
        personal scope. Multi-tenant routing is deferred to Phase 1 (see
        `#/components/schemas/TenantContext`); v1 runs single-tenant.
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated, but lacks permission (or step-up required)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit / lockout tripped
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflicts with the resource's current state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    JournalEntry:
      type: object
      required: [id, body_md, asset_ids, occurred_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        body_md: { type: string }
        mood: { type: string, nullable: true }
        asset_ids:
          type: array
          items: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JournalEntryWrite:
      type: object
      description: |
        Create requires body_md; PATCH accepts any subset of the fields. `asset_ids`
        is rejected with 422 `journal/invalid-asset` until photo attachments (P1.5).
      properties:
        body_md: { type: string, minLength: 1, maxLength: 20000 }
        mood: { type: string, nullable: true, minLength: 1, maxLength: 80 }
        occurred_at:
          type: string
          format: date-time
          description: Optional; defaults to now. Backdating and future-dating are allowed.

    # ── Ops (SPEC-09) ───────────────────────────────────────────────────────
    OpsBackupRun:
      type: object
      description: One row of the backup-run ledger (`ops_backup_runs`).
      required: [id, status, started_at]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [running, ok, failed]
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        size_bytes: { type: integer, format: int64, nullable: true }
        storage_key: { type: string, nullable: true }
        error: { type: string, nullable: true }
    OpsStatus:
      type: object
      description: |
        Freshness sentinel for the nightly Postgres backup (P0.5). `last_success_at`
        and `hours_since_success` are both null when a backup has never succeeded.
      required: [state]
      properties:
        state:
          type: string
          enum: [ok, stale, failed]
          description: |
            `failed` (most recent completed run failed) → `stale` (no success within
            26 h, incl. never-ran) → `ok`. A running run never changes state.
        last_success_at:
          type: string
          format: date-time
          nullable: true
          description: Completion time of the most recent successful run; null if none.
        hours_since_success:
          type: number
          nullable: true
          description: Hours since the last success; null if none.
        last_run:
          allOf:
            - $ref: "#/components/schemas/OpsBackupRun"
          nullable: true
          description: The most recently started run of any status; null if none.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: boolean
        cache:
          type: boolean

    # ── Bank / personal ledger (SPEC-03) ────────────────────────────────────
    # All money fields are integer minor units (VND exponent 0, D-41).
    BankAccount:
      type: object
      required: [id, name, type, currency, opening_balance, balance, archived, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [cash, checking, savings, credit_card, ewallet, other] }
        currency: { type: string, description: ISO-4217, example: VND }
        opening_balance: { type: integer, format: int64 }
        balance: { type: integer, format: int64, description: Derived (opening + Σcredits − Σdebits); always current. }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
    BankAccountCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [cash, checking, savings, credit_card, ewallet, other] }
        currency: { type: string, default: VND }
        opening_balance: { type: integer, format: int64, default: 0 }
    BankAccountPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        archived: { type: boolean }
        currency: { type: string, description: Only mutable while the account is empty. }
    BankCategory:
      type: object
      required: [id, name, kind, seed]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        kind: { type: string, enum: [income, expense] }
        seed: { type: boolean, description: A user_id-NULL default (visible to all, mutable by none). }
        icon: { type: string, maxLength: 16, nullable: true, description: "An emoji, e.g. 🍜. Not a sprite id — see migration 0042." }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', nullable: true, description: "Hex only; the value reaches a style attribute." }
    BankCategoryCreate:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [income, expense] }
        parent_id: { type: string, format: uuid, nullable: true, description: Must be a top-level category of the same kind. }
        icon: { type: string, maxLength: 16, nullable: true, description: "An emoji, e.g. 🍜. Not a sprite id — see migration 0042." }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', nullable: true, description: "Hex only; the value reaches a style attribute." }
    BankCategoryPatch:
      type: object
      description: >
        kind is immutable. `parent_id`, `icon` and `color` follow the same
        present-vs-absent rule: present (including null) sets it, absent leaves
        it alone. Seeds are immutable, so a patch against one is a 404.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parent_id: { type: string, format: uuid, nullable: true }
        icon: { type: string, maxLength: 16, nullable: true, description: "An emoji, e.g. 🍜. Not a sprite id — see migration 0042." }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', nullable: true, description: "Hex only; the value reaches a style attribute." }
    BankTransaction:
      type: object
      required: [id, account_id, amount, direction, is_transfer, occurred_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, nullable: true }
        amount: { type: integer, format: int64, description: Strictly positive minor units. }
        direction: { type: string, enum: [debit, credit] }
        transfer_id: { type: string, format: uuid, nullable: true }
        is_transfer: { type: boolean, description: True for a transfer leg (transfer_id set AND category_id null). }
        occurred_at: { type: string, format: date, description: "YYYY-MM-DD" }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BankTransactionCreate:
      type: object
      required: [account_id, category_id, amount, direction]
      properties:
        account_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, description: Own or seed; kind must match direction. }
        amount: { type: integer, format: int64, minimum: 1 }
        direction: { type: string, enum: [debit, credit] }
        occurred_at: { type: string, format: date, description: Defaults to today. }
        note: { type: string, nullable: true }
    BankTransactionPatch:
      type: object
      properties:
        account_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1 }
        direction: { type: string, enum: [debit, credit] }
        occurred_at: { type: string, format: date }
        note: { type: string, nullable: true }
    BankTransferCreate:
      type: object
      required: [from_account, to_account, amount]
      properties:
        from_account: { type: string, format: uuid }
        to_account: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1 }
        occurred_at: { type: string, format: date }
        note: { type: string, nullable: true }
    BankTransferPatch:
      type: object
      properties:
        from_account: { type: string, format: uuid }
        to_account: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1 }
        occurred_at: { type: string, format: date }
        note: { type: string, nullable: true }
    BankTransfer:
      type: object
      required: [legs]
      properties:
        transfer_id: { type: string, format: uuid, nullable: true }
        legs:
          type: array
          items: { $ref: "#/components/schemas/BankTransaction" }
    BankBudgetLine:
      type: object
      required: [category_id, name, amount, spent]
      properties:
        category_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        parent_name: { type: string, nullable: true }
        amount: { type: integer, format: int64 }
        spent: { type: integer, format: int64, description: Σ expense debits this month incl. children, excl. transfer legs. }
    BankBudgetWrite:
      type: object
      required: [category_id, month]
      properties:
        category_id: { type: string, format: uuid, description: Must be expense-kind. }
        month: { type: string, description: "YYYY-MM" }
        amount: { type: integer, format: int64, nullable: true, description: 0 or null deletes the budget. }
    BankCategoryTotal:
      type: object
      required: [category_id, name, kind, total, tx_count]
      properties:
        category_id: { type: string, format: uuid, description: The top-level category the total rolls up to. }
        name: { type: string }
        kind: { type: string, enum: [income, expense] }
        icon: { type: string, nullable: true }
        color: { type: string, nullable: true }
        total: { type: integer, format: int64, description: Minor units (D-41). }
        tx_count: { type: integer, format: int64 }
    BankMonthFlow:
      type: object
      required: [month, income, expense]
      properties:
        month: { type: string, description: "YYYY-MM" }
        income: { type: integer, format: int64 }
        expense: { type: integer, format: int64 }
    BankReport:
      type: object
      required: [month, income, expense, expenses, incomes, trend]
      properties:
        month: { type: string, description: "YYYY-MM" }
        income: { type: integer, format: int64 }
        expense: { type: integer, format: int64 }
        expenses: { type: array, items: { $ref: "#/components/schemas/BankCategoryTotal" } }
        incomes: { type: array, items: { $ref: "#/components/schemas/BankCategoryTotal" } }
        trend: { type: array, items: { $ref: "#/components/schemas/BankMonthFlow" } }
    BankDashboard:
      type: object
      required: [month, accounts, income, expense, budgets, recent]
      properties:
        month: { type: string }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/BankAccount" }
        income: { type: integer, format: int64 }
        expense: { type: integer, format: int64 }
        budgets:
          type: array
          items: { $ref: "#/components/schemas/BankBudgetLine" }
        recent:
          type: array
          items: { $ref: "#/components/schemas/BankTransaction" }

    # ── Comic vertical (SPEC-02) ────────────────────────────────────────────
    SyncSource:
      type: object
      required: [id, comic_id, source_url, source_site, chapters_hint, last_status, total_chapters, scraped_chapters, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        comic_id: { type: string, format: uuid }
        source_url: { type: string, format: uri }
        source_site: { type: string, description: Host extracted from source_url }
        chapters_hint: { type: string, description: "Blank = all; an 'A-B' range, or explicit chapter URLs" }
        last_status:
          type: string
          enum: [idle, syncing, done, failed, cancelled]
        total_chapters: { type: integer, description: Chapters discovered at the source }
        scraped_chapters: { type: integer, description: Chapters scraped so far this run }
        last_import_id: { type: string, format: uuid, description: The batch import currently in flight }
        last_error: { type: string }
        last_synced_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SyncSourceList:
      type: object
      required: [sources]
      properties:
        sources: { type: array, items: { $ref: "#/components/schemas/SyncSource" } }
    SyncSourceCreate:
      type: object
      required: [source_url]
      properties:
        source_url: { type: string, format: uri, description: Must be http(s), allowlisted, and resolve to a public address }
        chapters_hint: { type: string }
    SyncBatchRequest:
      type: object
      required: [source_id, owner_id]
      properties:
        source_id: { type: string, format: uuid }
        owner_id:
          type: string
          format: uuid
          description: |
            The source owner, echoed back from the value the api handed the scraper.
            It supplies the tenant these session-less endpoints scope their writes to,
            and is verified against the row — a wrong value yields 404.
    SyncBatchResponse:
      type: object
      required: [import_id, upload_key]
      properties:
        import_id: { type: string, format: uuid }
        upload_key: { type: string, description: "Object key the batch zip must be uploaded to (import/{import_id}.zip)" }
    SyncCallbackRequest:
      type: object
      required: [import_id, owner_id, ok]
      properties:
        import_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid, description: See SyncBatchRequest.owner_id }
        ok: { type: boolean, description: false fails that batch's import job }
        error: { type: string }
    SyncProgressRequest:
      type: object
      required: [source_id, owner_id, scraped, total]
      properties:
        source_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid, description: See SyncBatchRequest.owner_id }
        scraped: { type: integer }
        total: { type: integer }
    SyncFinalizeRequest:
      type: object
      required: [source_id, owner_id, ok]
      properties:
        source_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid, description: See SyncBatchRequest.owner_id }
        ok: { type: boolean }
        failed: { type: string, description: Summary of chapters that failed, shown on the source row }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    Comic:
      type: object
      required: [id, owner_id, title, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        cover_asset_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [draft, published] }
        reading_direction: { type: string, enum: [ltr, rtl, vertical], default: vertical, description: "Reading direction of the work (manga = rtl). Drives the reader's paged navigation order and default mode." }
        chapter_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ComicDetail:
      allOf:
        - $ref: "#/components/schemas/Comic"
        - type: object
          properties:
            chapters: { type: array, items: { $ref: "#/components/schemas/Chapter" } }
            progress: { $ref: "#/components/schemas/ComicProgress" }
    ComicCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        cover_asset_id: { type: string, format: uuid, nullable: true, description: A ready image asset you own. }
    ComicPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        reading_direction: { type: string, enum: [ltr, rtl, vertical] }
        cover_asset_id: { type: string, format: uuid, nullable: true }
    Chapter:
      type: object
      required: [id, comic_id, title, sort_order, created_at]
      properties:
        id: { type: string, format: uuid }
        comic_id: { type: string, format: uuid }
        title: { type: string }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
    ChapterCreate:
      type: object
      required: [title, sort_order]
      properties:
        title: { type: string }
        sort_order: { type: integer }
    Page:
      type: object
      required: [id, chapter_id, asset_id, sort_order]
      properties:
        id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        sort_order: { type: integer }
    PagesCreate:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items:
            type: object
            required: [asset_id, sort_order]
            properties:
              asset_id: { type: string, format: uuid }
              sort_order: { type: integer }
    ReaderPage:
      type: object
      required: [page_id, asset_id]
      properties:
        page_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid, description: "Render the medium variant (GET /assets/ID/variants/medium)." }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
    ComicProgress:
      type: object
      required: [chapter_id, updated_at]
      properties:
        chapter_id: { type: string, format: uuid }
        page_id: { type: string, format: uuid, nullable: true }
        updated_at: { type: string, format: date-time }
    ProgressWrite:
      type: object
      required: [chapter_id]
      properties:
        chapter_id: { type: string, format: uuid }
        page_id: { type: string, format: uuid, nullable: true }
    ReorderRequest:
      type: object
      required: [order]
      properties:
        order:
          type: array
          items: { type: string, format: uuid }

    # ── People registry (SPEC-08) ───────────────────────────────────────────
    Birthday:
      type: object
      required: [month, day]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
        year: { type: integer, nullable: true, description: Optional — many people won't share a year. }
        calendar: { type: string, enum: [solar, lunar], default: solar }
    Person:
      type: object
      required: [id, display_name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        relationship: { type: string, nullable: true }
        birthday:
          allOf: [{ $ref: "#/components/schemas/Birthday" }]
          nullable: true
        contact: { type: object, additionalProperties: true }
        note_md: { type: string, nullable: true }
        avatar_asset_id: { type: string, format: uuid, nullable: true }
        circle: { $ref: "#/components/schemas/PersonCircle" }
        linked_user_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The portal account this entry stands for, when it stands for one —
            set by adding someone from `/people/suggestions`. Null for everyone
            who has no account here, which is most of a personal registry.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Connection:
      type: object
      description: |
        One connection, from the caller's point of view (migration
        `0037_social_connections`).
      required: [id, user_id, status, outgoing, created_at]
      properties:
        id: { type: string, format: uuid, description: The connection's id, not the other person's. }
        user_id: { type: string, format: uuid, description: The OTHER person's account id. }
        display_name: { type: string, description: "The other person's name. Absent on the write responses, which return the row rather than a rendered list." }
        status: { type: string, enum: [pending, accepted] }
        outgoing: { type: boolean, description: "True when the caller sent the request. A declined request is deleted, so there is no 'declined' status." }
        created_at: { type: string, format: date-time }
        responded_at: { type: string, format: date-time, nullable: true }

    PersonCircle:
      type: string
      enum: [close_friend, family, other]
      default: other
      description: |
        Which fixed section of the people rail this person appears in
        (migration `0035_people_circles`).

        This is beside `relationship`, not instead of it: `relationship` stays
        the free text you wrote ("mẹ", "bạn đại học"), while `circle` is the
        closed set the UI can group by without guessing at what that text means.

    PersonWrite:
      type: object
      description: "POST requires display_name; PATCH accepts any subset. A birthday of null clears it."
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        relationship: { type: string, nullable: true }
        circle: { $ref: "#/components/schemas/PersonCircle" }
        linked_user_id:
          type: string
          format: uuid
          nullable: true
          description: On create only — records that this person is the given portal account.
        birthday:
          allOf: [{ $ref: "#/components/schemas/Birthday" }]
          nullable: true
        contact: { type: object, additionalProperties: true }
        note_md: { type: string, nullable: true }
    UpcomingBirthday:
      type: object
      required: [person_id, display_name, next_occurrence, days_until]
      properties:
        person_id: { type: string, format: uuid }
        display_name: { type: string }
        next_occurrence: { type: string, format: date }
        days_until: { type: integer }
        age_turning: { type: integer, nullable: true }

    # ── Life-stream home (SPEC-06) ──────────────────────────────────────────
    StreamItem:
      type: object
      description: "One merged-timeline card. Journal items carry body_md/mood; system items a synthesized title/href."
      required: [id, source_module, event_type, ref_id, occurred_at]
      properties:
        id: { type: string, format: uuid }
        source_module: { type: string, description: "journal | media | bank | comic | people" }
        event_type: { type: string }
        ref_id: { type: string, format: uuid, description: "Id of the record the card projects — the journal entry id for `source_module: journal` (the handle a client needs to edit or delete the post), otherwise the asset / transaction / chapter id." }
        occurred_at: { type: string, format: date-time }
        body_md: { type: string, nullable: true }
        mood: { type: string, nullable: true }
        title: { type: string, nullable: true }
        href: { type: string, nullable: true }

    # ── RFC 7807 error contract (D-7 / D-29) ────────────────────────────────
    Problem:
      type: object
      description: |
        RFC 7807 problem detail, served as `application/problem+json`. `type` is a
        stable URI (also the i18n key); Portal adds the extensions below.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: "about:blank"
          description: Stable problem-type URI (i18n key).
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code, repeated for convenience.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri
          description: URI reference identifying the specific occurrence.
        code:
          type: string
          description: |
            Reserved. The machine-stable slug lives in `type`
            (`account/invalid-credentials`), so nothing emits `code` today —
            do not branch on it.
        required_acr:
          type: string
          description: For step-up (403) — the ACR the caller must satisfy [D-27].
        enrollment_url:
          type: string
          format: uri
          description: For MFA-enrollment (403) — where to enroll a second factor [D-28].
      additionalProperties: true

    # Legacy error body. Superseded by Problem and emitted by nothing — kept
    # only so generated clients naming the type still compile (see
    # info.description). Referenced by no operation; drop when clients allow.
    Error:
      deprecated: true
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    # ── Auth ────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password }
        remember:
          type: boolean
          default: false
          description: Persist the session (durable refresh cookie) vs a session cookie.

    MusicImportStatus:
      type: string
      enum: [pending, uploaded, processing, done, failed]
      description: |
        `pending` — job registered, no archive yet.
        `uploaded` — archive stored, worker queued but not started.
        `processing` — unpacking; `total` is known, `succeeded`/`failed` climb.
        `done` — finished. Per-file failures live in `report`; this status does
        not mean every file worked.
        `failed` — the job could not run at all (not a zip, empty, over a limit);
        `error` says why.

    MusicImportReportEntry:
      type: object
      required: [name, ok]
      properties:
        name: { type: string, description: The entry's filename inside the archive. }
        ok:   { type: boolean }
        track_id: { type: string, format: uuid, description: Present when `ok`. }
        title:    { type: string, description: The title the importer settled on. }
        error:    { type: string, description: Present when not `ok`. }

    MusicImport:
      type: object
      required: [id, status, total, succeeded, failed, report, created_at, updated_at]
      properties:
        id:     { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MusicImportStatus" }
        total:
          type: integer
          description: Audio entries found in the archive. 0 until unpacking starts.
        succeeded: { type: integer }
        failed:
          type: integer
          description: Entries that failed. Does not stop the job.
        report:
          type: array
          description: One line per audio entry, in import order.
          items: { $ref: "#/components/schemas/MusicImportReportEntry" }
        error:
          type: string
          nullable: true
          description: Job-level failure. Null unless `status` is `failed`.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LayoutMenuItem:
      type: object
      required: [id, key, label, icon, position, visible, is_system]
      properties:
        id:    { type: string, format: uuid }
        key:
          type: string
          description: Stable handle that survives a rename. Lowercase letters, digits, `-` and `_`.
        label: { type: string, maxLength: 60 }
        icon:
          type: string
          description: Sprite name, resolved by the frontend's Icon component.
        href:
          type: string
          nullable: true
          description: |
            In-app path starting with a single `/`. Null renders a row that
            navigates nowhere — the template ships several of those.
        permission:
          type: string
          nullable: true
          description: |
            Permission code required to SEE this row. Null = every signed-in
            user. Enforced server-side on `GET /layout`.
        position:
          type: integer
          description: Server-assigned from array order on save; do not compute it client-side.
        visible: { type: boolean }
        is_system:
          type: boolean
          description: |
            Seeded rows. Renameable, reorderable and hideable, but never deleted
            by a whole-set save — an empty menu is not recoverable from the UI.

    LayoutWidget:
      type: object
      required: [id, key, label, slot, position, visible]
      properties:
        id:  { type: string, format: uuid }
        key:
          type: string
          description: |
            Must match a component in the frontend widget registry. The database
            cannot conjure a component, so this catalogue is fixed by the bundle.
        label: { type: string, maxLength: 60 }
        slot:
          type: string
          enum: [left, right]
          description: Which dashboard rail the card sits in.
        permission: { type: string, nullable: true }
        position:
          type: integer
          description: Server-assigned from array order, renumbered per slot.
        visible: { type: boolean }

    LayoutConfig:
      type: object
      required: [menu, widgets]
      properties:
        menu:
          type: array
          items: { $ref: "#/components/schemas/LayoutMenuItem" }
        widgets:
          type: array
          items: { $ref: "#/components/schemas/LayoutWidget" }

    LayoutMenuSaveRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 80
          description: The complete menu, in the order it should render.
          items:
            type: object
            required: [key, label, icon, visible]
            properties:
              key:        { type: string }
              label:      { type: string, maxLength: 60 }
              icon:       { type: string }
              href:       { type: string, description: "Empty = no link." }
              permission: { type: string, description: "Empty = visible to everyone signed in." }
              visible:    { type: boolean }

    LayoutWidgetsSaveRequest:
      type: object
      required: [widgets]
      properties:
        widgets:
          type: array
          description: Every widget, grouped by slot in the order it should render.
          items:
            type: object
            required: [key, label, slot, visible]
            properties:
              key:        { type: string }
              label:      { type: string, maxLength: 60 }
              slot:       { type: string, enum: [left, right] }
              permission: { type: string }
              visible:    { type: boolean }

    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected]
      description: |
        Registration state (migration 0031). `pending` and `rejected` both refuse
        login and refuse to verify an already-issued access token; only
        `approved` can hold a session.

    AdminUser:
      type: object
      required:
        [id, email, display_name, approval_status, disabled, has_password, created_at, roles]
      properties:
        id:              { type: string, format: uuid }
        email:           { type: string, format: email }
        display_name:    { type: string }
        avatar_url:      { type: string, nullable: true }
        approval_status: { $ref: "#/components/schemas/ApprovalStatus" }
        approval_note:
          type: string
          nullable: true
          description: The reviewer's reason. Shown back to a rejected user on their next login attempt.
        approved_at:  { type: string, format: date-time, nullable: true }
        approved_by:  { type: string, format: uuid, nullable: true }
        disabled:
          type: boolean
          description: |
            Independent of `approval_status`. A disabled account was switched off
            after the fact; a pending one was never let in.
        has_password:
          type: boolean
          description: False for rows provisioned without credentials (admin invite).
        created_at: { type: string, format: date-time }
        roles:
          type: array
          description: Role codes currently held, expired grants excluded.
          items: { type: string }

    AdminUserPage:
      type: object
      required: [users, total, limit, offset, counts]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        total:  { type: integer, description: Rows matching the filter, ignoring paging. }
        limit:  { type: integer }
        offset: { type: integer }
        counts:
          type: object
          description: Totals per approval state across the whole table, for the queue badge.
          required: [pending, approved, rejected]
          properties:
            pending:  { type: integer }
            approved: { type: integer }
            rejected: { type: integer }

    AdminCreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password:
          type: string
          format: password
          minLength: 8
          description: Required — an account with no credential can neither sign in nor recover.
        display_name:
          type: string
          description: Optional; defaults to the email local-part.

    AdminUpdateUserRequest:
      type: object
      description: Omitted or empty fields are left unchanged.
      properties:
        email:        { type: string, format: email }
        display_name: { type: string }
        password:
          type: string
          format: password
          minLength: 8
          description: |
            Setting this revokes every session the old password issued — the
            `token_version` bump and the refresh chain both.

    AdminDeleteUserRequest:
      type: object
      required: [confirm_email]
      properties:
        confirm_email:
          type: string
          description: |
            Must equal the target's email, case-insensitively. Enforced by the
            server so a misclick or a replayed request cannot reach a cascading
            delete.

    ApprovalDecision:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
          description: Optional reason, kept on the account and shown to a rejected user.

    RoleAssignment:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          description: The complete set of role codes the user should end up with.
          items: { type: string }

    RolePermissionAssignment:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          description: The complete set of permission codes granted DIRECTLY to this role.
          items: { type: string }

    RoleInput:
      type: object
      required: [name]
      properties:
        code:
          type: string
          description: |
            Lowercase letters, digits, `-` and `_`. Required on create, ignored
            on update — the code is immutable.
        name:        { type: string }
        description: { type: string }
        parent_code:
          type: string
          description: Inherit every permission of this role. Empty means a root role.

    AdminRole:
      type: object
      required: [id, code, name, is_system, user_count]
      properties:
        id:          { type: string, format: uuid }
        code:        { type: string }
        name:        { type: string }
        description: { type: string }
        parent_code: { type: string, nullable: true }
        is_system:
          type: boolean
          description: Seeded roles (guest…superadmin). Cannot be edited or deleted.
        user_count:  { type: integer }

    MatrixRole:
      allOf:
        - $ref: "#/components/schemas/AdminRole"
        - type: object
          required: [direct, effective]
          properties:
            direct:
              type: array
              description: Permissions granted to this role itself — the editable checkboxes.
              items: { type: string }
            effective:
              type: array
              description: |
                `direct` unioned with every ancestor's grants. Read-only: change an
                inherited entry by editing the role it comes from.
              items: { type: string }

    MatrixPermission:
      type: object
      required: [code, group]
      properties:
        code:        { type: string }
        description: { type: string }
        group:
          type: string
          description: Leading resource segment (`music:write:own` → `music`); how the grid groups columns.

    PermissionMatrix:
      type: object
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/MatrixRole" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/MatrixPermission" }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        display_name:
          type: string
          description: Optional; defaults to the email local-part.

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:        { type: string, description: The one-time reset token from the email link. }
        new_password: { type: string, format: password, minLength: 8 }

    AccessToken:
      type: object
      required: [access_token, expires_in, token_type]
      properties:
        access_token: { type: string }
        expires_in:   { type: integer, description: "seconds until expiry" }
        token_type:   { type: string, enum: [Bearer] }

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/AccessToken"
        - type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id, email, display_name, roles]
              properties:
                id:           { type: string, format: uuid }
                email:        { type: string, format: email }
                display_name: { type: string }
                roles:
                  type: array
                  items: { type: string }

    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true

    CurrentUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [roles, permissions]
          properties:
            roles:
              type: array
              description: Role codes (e.g. ["user","creator"]). Frontend uses these to render UI affordances; the server is the authority on perm checks.
              items:
                type: string
            permissions:
              type: array
              description: |
                The caller's EFFECTIVE permission codes — own roles unioned with
                every ancestor role's grants, exactly what the server checks
                against. Present so the UI can hide affordances the API would
                refuse; role names stopped being a usable proxy once roles became
                editable from the permission matrix. Wildcards appear literally
                (a superadmin gets `["*"]`), so match with the same grammar the
                server uses rather than by string equality. Empty if the
                permission cache could not be read — degrade the menu, never the
                identity call.
              items:
                type: string

    # ── Media ───────────────────────────────────────────────────────────────
    AssetKind:
      type: string
      enum: [video, audio, image]

    AssetStatus:
      type: string
      enum: [uploaded, processing, ready, failed]

    AssetVisibility:
      type: string
      enum: [private, public]
      default: private
      description: |
        Who may read the asset and its renditions (migration `0032_media_asset_acl`).

        `private` — the owner, plus admins of the owning tenant. This is the
        default and the only value the upload path writes.
        `public` — anyone, including callers with no session; the variant and
        HLS routes serve these anonymously and mark them cacheable by shared
        caches.

        Enforcement is row-level security in Postgres, not handler code: an
        asset the caller may not read does not exist for their query, so every
        such request answers 404 rather than 403.

    Asset:
      type: object
      required: [id, status, kind, mimeType, sizeBytes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AssetStatus"
        kind:
          $ref: "#/components/schemas/AssetKind"
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        durationMs:
          type: integer
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        visibility:
          $ref: "#/components/schemas/AssetVisibility"
        hlsUrl:
          type: string
          format: uri
          nullable: true
          description: Master playlist URL; present once `status` is `ready`.
        error:
          type: string
          nullable: true
          description: Failure reason; present when `status` is `failed`.
        createdAt:
          type: string
          format: date-time

    CreateAssetRequest:
      type: object
      required: [filename, sizeBytes]
      properties:
        filename:
          type: string
        contentType:
          type: string
          default: application/octet-stream
        sizeBytes:
          type: integer
          format: int64

    AssetUploadSession:
      type: object
      required: [asset, upload]
      properties:
        asset:
          $ref: "#/components/schemas/Asset"
        upload:
          type: object
          required: [url, method]
          description: Presigned request the client performs to store the original.
          properties:
            url:    { type: string, format: uri }
            method: { type: string, enum: [PUT] }
            headers:
              type: object
              additionalProperties: { type: string }

    # ── Notifications (SPEC-04) ─────────────────────────────────────────────
    Notification:
      type: object
      required: [id, type, title, data, read_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Open type registry (e.g. `media.asset_ready`). See notify/README.md.
        title:
          type: string
        body:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Target ids / links — e.g. `href` for the bell's click-through.
        read_at:
          type: string
          format: date-time
          nullable: true
          description: When the notification was marked read; null while unread.
        created_at:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [items, unread_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unread_count:
          type: integer
          description: Unread badge count for the bell.
        next_cursor:
          type: string
          nullable: true
          description: Keyset cursor for the next page; absent/null on the last page.

    UnreadCount:
      type: object
      required: [unread_count]
      properties:
        unread_count:
          type: integer

    # ── Cross-module schemas (eager, per D-29) ──────────────────────────────
    # Defined ahead of the modules that need them so the contract is stable when
    # bank / tenant / the domain verticals land. Not all are referenced yet.
    Money:
      type: object
      description: Exact monetary amount [D-14/D-15]. `amount` is a decimal string to avoid float error.
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal string, e.g. "1234.56" (numeric(20,8) at rest).
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
        currency:
          type: string
          description: ISO 4217 code, e.g. "USD".
          minLength: 3
          maxLength: 3

    PaginatedResult:
      type: object
      description: |
        Cursor-paginated envelope. Concrete endpoints override `items` with their
        element type (OpenAPI has no generics — compose with `allOf` + an `items`
        override, or document the element type in the operation).
      required: [items]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null on the last page.
        total:
          type: integer
          nullable: true
          description: Total count when cheap to compute; otherwise omitted.

    TenantContext:
      type: object
      description: |
        Resolved tenant scope for the `/t/{tenant}/…` prefix [D-23]. Multi-tenancy
        is deferred to Phase 1; v1 runs single-tenant (`me`).
      required: [tenantId, slug]
      properties:
        tenantId:
          type: string
          format: uuid
        slug:
          type: string
        kind:
          type: string
          enum: [org, household]

    PlaybackProgress:
      type: object
      required: [position_ms, updated_at]
      properties:
        position_ms: { type: integer, format: int64 }
        progress_pct:
          type: integer
          description: Fractional completion 0..100. Absent if duration is unknown.
        completed_at:
          type: string
          format: date-time
          nullable: true
        updated_at: { type: string, format: date-time }

    ContinueItem:
      type: object
      description: |
        One "continue watching / reading / listening" entry for the cross-domain
        `/continue` rail [D-20]. Aggregated from each vertical's progress table.
      required: [module, ref_id, title, progress_pct, href, updated_at]
      properties:
        module:
          type: string
          enum: [media, movie, music, story, comic]
        ref_id:
          type: string
          format: uuid
        title:
          type: string
        progress_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: Fractional completion 0..100.
        href:
          type: string
        poster_url:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time

    # ══ Catalogue verticals ═══════════════════════════════════════════════
    # movie / music / story share the comic shape: an owner, a title, optional
    # media asset refs, and a draft→published status.

    Movie:
      type: object
      required: [id, owner_id, title, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        video_asset_id: { type: string, format: uuid, nullable: true, description: A ready video asset you own. }
        poster_asset_id: { type: string, format: uuid, nullable: true, description: A ready image asset you own. }
        release_year: { type: integer, nullable: true }
        status: { type: string, enum: [draft, published] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MovieList:
      type: object
      required: [movies]
      properties:
        movies: { type: array, items: { $ref: "#/components/schemas/Movie" } }
        next_cursor: { type: string, nullable: true }
    MovieCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        video_asset_id: { type: string, format: uuid, nullable: true }
        poster_asset_id: { type: string, format: uuid, nullable: true }
        release_year: { type: integer, nullable: true }
    MoviePatch:
      type: object
      description: |
        Absent means unchanged; an explicit `null` clears the field. That
        three-state distinction is why the asset ids are not simply nullable
        strings on the wire.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        video_asset_id: { type: string, format: uuid, nullable: true }
        poster_asset_id: { type: string, format: uuid, nullable: true }
        release_year: { type: integer, nullable: true }

    Track:
      type: object
      required: [id, owner_id, title, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        title: { type: string }
        artist: { type: string, nullable: true }
        album: { type: string, nullable: true }
        description: { type: string, nullable: true }
        audio_asset_id: { type: string, format: uuid, nullable: true, description: A ready audio asset you own. }
        cover_asset_id: { type: string, format: uuid, nullable: true, description: A ready image asset you own. }
        status: { type: string, enum: [draft, published] }
        release_year:
          type: integer
          nullable: true
          description: Original release year, from the catalogue lookup. Not in the audio file.
        genre:
          type: string
          nullable: true
          description: Most-voted MusicBrainz community tag. A folksonomy, not a taxonomy.
        mb_recording_id:
          type: string
          format: uuid
          nullable: true
          description: |
            What the lookup matched. Kept so a later pass can go straight to the
            right entity instead of re-running a fuzzy search, and so a wrong
            match is traceable to the thing that was matched.
        mb_release_id: { type: string, format: uuid, nullable: true }
        lookup_status:
          type: string
          enum: [none, pending, matched, no_match, failed]
          description: |
            `none` — never looked up. `no_match` — asked, nothing scored high
            enough; an ordinary outcome, not an error. `failed` — the call itself
            failed and will be retried.
        lookup_note:
          type: string
          nullable: true
          description: Why a match was refused, or why the call failed. Shown to the user.
        lookup_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TrackList:
      type: object
      required: [tracks]
      properties:
        tracks: { type: array, items: { $ref: "#/components/schemas/Track" } }
        next_cursor: { type: string, nullable: true }
    TrackCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        artist: { type: string, nullable: true }
        album: { type: string, nullable: true }
        description: { type: string, nullable: true }
        audio_asset_id: { type: string, format: uuid, nullable: true }
        cover_asset_id: { type: string, format: uuid, nullable: true }
    TrackPatch:
      type: object
      description: Absent means unchanged; an explicit `null` clears the field.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        artist: { type: string, nullable: true }
        album: { type: string, nullable: true }
        description: { type: string, nullable: true }
        audio_asset_id: { type: string, format: uuid, nullable: true }
        cover_asset_id: { type: string, format: uuid, nullable: true }

    Story:
      type: object
      required: [id, owner_id, title, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        cover_asset_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [draft, published] }
        chapter_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StoryDetail:
      allOf:
        - $ref: "#/components/schemas/Story"
        - type: object
          properties:
            chapters:
              type: array
              description: Chapter summaries — id, title and sort_order only, never `body_md`.
              items: { $ref: "#/components/schemas/StoryChapterSummary" }
    StoryList:
      type: object
      required: [stories]
      properties:
        stories: { type: array, items: { $ref: "#/components/schemas/Story" } }
        next_cursor: { type: string, nullable: true }
    StoryCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        cover_asset_id: { type: string, format: uuid, nullable: true }
    StoryPatch:
      type: object
      description: Absent means unchanged; an explicit `null` clears the field.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        cover_asset_id: { type: string, format: uuid, nullable: true }
    StoryChapter:
      type: object
      required: [id, story_id, title, body_md, sort_order, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        story_id: { type: string, format: uuid }
        title: { type: string }
        body_md: { type: string, description: "Markdown. Capped at 4 MiB — four times the platform default, because a chapter is prose." }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StoryChapterSummary:
      type: object
      required: [id, title, sort_order]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        sort_order: { type: integer }
    StoryChapterCreate:
      type: object
      required: [title, body_md, sort_order]
      properties:
        title: { type: string }
        body_md: { type: string }
        sort_order: { type: integer }
    StoryChapterPatch:
      type: object
      properties:
        title: { type: string }
        body_md: { type: string }

    # ══ Comic zip import (SPEC-02 P1.7) ═══════════════════════════════════

    ImportJob:
      type: object
      required: [id, status, total, succeeded, failed, report, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        comic_id: { type: string, format: uuid, nullable: true, description: Set for a whole-comic import. }
        chapter_id: { type: string, format: uuid, nullable: true, description: Set for a single-chapter import. }
        status: { type: string, enum: [pending, uploaded, running, done, failed] }
        total: { type: integer, description: Entries the zip was found to contain. }
        succeeded: { type: integer }
        failed: { type: integer }
        upload_ref: { type: string, nullable: true, description: "Present while status is `pending` — PUT the zip to /imports/{id}/zip." }
        error: { type: string, nullable: true }
        report:
          type: array
          description: Per-entry outcome, populated once the job has run.
          items:
            type: object
            required: [name, ok]
            properties:
              name: { type: string }
              ok: { type: boolean }
              error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ══ Tenancy ═══════════════════════════════════════════════════════════

    Organization:
      type: object
      required: [id, kind, slug, name, owner_id]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [org, household, personal]
          description: |
            `personal` is the synthetic per-user tenant every account gets at
            first tenant resolution. `org` and `household` exist in the schema
            from day one (D-24) but have no creation endpoint yet.
        slug: { type: string }
        name: { type: string }
        owner_id: { type: string, format: uuid }

