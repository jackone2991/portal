openapi: 3.1.0
info:
  title: Portal API
  version: 0.1.0
  description: |
    Portal — self-hosted media platform API.

    This document is the **source of truth** for the HTTP contract.
    Server stubs (Go) and the TypeScript client are both generated from it.

    ## Errors

    Error responses use the **RFC 7807** `application/problem+json` shape
    (`#/components/schemas/Problem`). The stable `type` URI doubles as the i18n
    key; the `code` extension is a machine-stable slug (e.g. `invalid_credentials`).

    > **Migration note (v1):** RFC 7807 is the target contract per [D-7]/[D-29].
    > Some handlers still emit the legacy `{code, message}` body
    > (`#/components/schemas/Error`); they are retrofitted to `Problem` as they
    > are touched, not in a sweep (see ADR-01). Treat `Problem` as authoritative.

    Auth is **local password** ([ADR-06](../doc/en/architecture/06-local-auth-model.md));
    the OIDC/Authentik login + `/auth/callback` flow was removed.

servers:
  - url: https://api.portal.localhost
    description: Local dev (via Traefik)
  - url: http://localhost:8080
    description: Direct (no proxy)

tags:
  - name: health
  - name: auth
  - name: assets
  - name: movies
  - name: music
  - name: stories

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A dependency (DB or cache) is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      tags: [auth]
      summary: Local password login
      description: |
        Verifies `email` + `password` against `users.password_hash` (Argon2id,
        constant-time). On success, mints an access JWT + refresh token, sets the
        `portal_access` / `portal_refresh` / `portal_session` cookies, and returns
        the access token in the body for API clients. Brute-force attempts are
        rate-limited per IP and per account (429).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; cookies set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Account is disabled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/register:
    post:
      tags: [auth]
      summary: Create a local account
      description: |
        Creates a local account (Argon2id hash) and seeds the default `user`
        role. Returns **201 without a session** — the user is sent back to
        `/login` to sign in with the new credentials. Deployments that want
        invite-only signup gate this route at the router.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created (no session issued)
          content:
            application/json:
              schema:
                type: object
                required: [status, email]
                properties:
                  status: { type: string, enum: [registered] }
                  email:  { type: string, format: email }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email already registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token, mint new access token
      description: |
        Reads the refresh token from the `portal_refresh` cookie (browser) or the
        `refresh_token` body field (API client). Rotates the token (old is
        revoked, new is issued) and returns a fresh access token. Reuse of an
        already-rotated token revokes the entire chain (token theft) and emits an
        `account.refresh.reuse_detected` audit event.
      operationId: refreshToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke current session and bump token_version
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204": { description: Logged out }

  /auth/logout-all:
    post:
      tags: [auth]
      summary: Revoke every session for the current user
      description: |
        Revokes all refresh tokens and bumps `users.token_version`,
        invalidating any access tokens already in flight.
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        "204": { description: All sessions revoked }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [auth]
      summary: Get the currently authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user (with role codes for UI gating)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /assets:
    get:
      tags: [assets]
      summary: List the caller's assets
      operationId: listAssets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's assets
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [assets]
      summary: Begin a media upload
      description: |
        Creates the asset row and returns a **presigned PUT** for the original
        bytes. The browser PUTs directly to object storage (prod/R2); in dev it
        may proxy through `PUT /assets/{id}/source`. Then call
        `POST /assets/{id}/complete` to enqueue transcoding.
      operationId: createAssetUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetUploadSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /assets/{id}:
    get:
      tags: [assets]
      summary: Get asset metadata
      operationId: getAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "200":
          description: Asset (includes `hlsUrl` once status is `ready`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/source:
    put:
      tags: [assets]
      summary: API-proxied upload of the original bytes (dev path)
      description: |
        Streams the raw original into object storage via the API. Used in dev
        where the presigned PUT endpoint is not browser-reachable; prod uploads
        go straight to the presigned URL from `POST /assets`. Body is the raw
        file; `Content-Type` is the media type.
      operationId: uploadAssetSource
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204": { description: Stored }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/complete:
    post:
      tags: [assets]
      summary: Confirm the upload and enqueue processing
      description: |
        Marks the source uploaded and enqueues a transcode (video) or thumbnail
        (image) job on Asynq. Asset status transitions to `processing` and
        eventually `ready` or `failed`.
      operationId: completeAssetUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AssetID"
      responses:
        "202":
          description: Processing started
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [processing] }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Source upload is not complete
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /assets/{id}/hls/{path}:
    get:
      tags: [assets]
      summary: Public HLS proxy (manifest + segments)
      description: |
        Serves the HLS master/variant manifests and media segments for a `ready`
        asset. **Public** (no bearer) so the `<video>`/Vidstack player can fetch
        segments directly; access to the asset id is the capability.
      operationId: getAssetHLS
      parameters:
        - $ref: "#/components/parameters/AssetID"
        - name: path
          in: path
          required: true
          description: Manifest or segment path under the asset's HLS output prefix.
          schema: { type: string }
      responses:
        "200":
          description: HLS manifest or media segment
          content:
            application/vnd.apple.mpegurl: {}
            video/mp2t: {}
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AssetID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantSlug:
      name: tenant
      in: path
      required: true
      description: |
        Tenant slug for the `/t/{tenant}/…` prefix. `me` selects the caller's
        personal scope. Multi-tenant routing is deferred to Phase 1 (see
        `#/components/schemas/TenantContext`); v1 runs single-tenant.
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated, but lacks permission (or step-up required)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit / lockout tripped
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: boolean
        cache:
          type: boolean

    # ── RFC 7807 error contract (D-7 / D-29) ────────────────────────────────
    Problem:
      type: object
      description: |
        RFC 7807 problem detail, served as `application/problem+json`. `type` is a
        stable URI (also the i18n key); Portal adds the extensions below.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: "about:blank"
          description: Stable problem-type URI (i18n key).
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code, repeated for convenience.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri
          description: URI reference identifying the specific occurrence.
        code:
          type: string
          description: Portal-stable machine slug (e.g. `invalid_credentials`).
        required_acr:
          type: string
          description: For step-up (403) — the ACR the caller must satisfy [D-27].
        enrollment_url:
          type: string
          format: uri
          description: For MFA-enrollment (403) — where to enroll a second factor [D-28].
      additionalProperties: true

    # Legacy error body still emitted by un-migrated handlers. Superseded by
    # Problem; kept for reference during the RFC 7807 migration (see info.description).
    Error:
      deprecated: true
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    # ── Auth ────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password }
        remember:
          type: boolean
          default: false
          description: Persist the session (durable refresh cookie) vs a session cookie.

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        display_name:
          type: string
          description: Optional; defaults to the email local-part.

    AccessToken:
      type: object
      required: [access_token, expires_in, token_type]
      properties:
        access_token: { type: string }
        expires_in:   { type: integer, description: "seconds until expiry" }
        token_type:   { type: string, enum: [Bearer] }

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/AccessToken"
        - type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id, email, display_name, roles]
              properties:
                id:           { type: string, format: uuid }
                email:        { type: string, format: email }
                display_name: { type: string }
                roles:
                  type: array
                  items: { type: string }

    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true

    CurrentUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [roles]
          properties:
            roles:
              type: array
              description: Role codes (e.g. ["user","creator"]). Frontend uses these to render UI affordances; the server is the authority on perm checks.
              items:
                type: string

    # ── Media ───────────────────────────────────────────────────────────────
    AssetKind:
      type: string
      enum: [video, audio, image]

    AssetStatus:
      type: string
      enum: [uploaded, processing, ready, failed]

    Asset:
      type: object
      required: [id, status, kind, mimeType, sizeBytes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AssetStatus"
        kind:
          $ref: "#/components/schemas/AssetKind"
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        durationMs:
          type: integer
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        hlsUrl:
          type: string
          format: uri
          nullable: true
          description: Master playlist URL; present once `status` is `ready`.
        error:
          type: string
          nullable: true
          description: Failure reason; present when `status` is `failed`.
        createdAt:
          type: string
          format: date-time

    CreateAssetRequest:
      type: object
      required: [filename, sizeBytes]
      properties:
        filename:
          type: string
        contentType:
          type: string
          default: application/octet-stream
        sizeBytes:
          type: integer
          format: int64

    AssetUploadSession:
      type: object
      required: [asset, upload]
      properties:
        asset:
          $ref: "#/components/schemas/Asset"
        upload:
          type: object
          required: [url, method]
          description: Presigned request the client performs to store the original.
          properties:
            url:    { type: string, format: uri }
            method: { type: string, enum: [PUT] }
            headers:
              type: object
              additionalProperties: { type: string }

    # ── Cross-module schemas (eager, per D-29) ──────────────────────────────
    # Defined ahead of the modules that need them so the contract is stable when
    # bank / tenant / the domain verticals land. Not all are referenced yet.
    Money:
      type: object
      description: Exact monetary amount [D-14/D-15]. `amount` is a decimal string to avoid float error.
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal string, e.g. "1234.56" (numeric(20,8) at rest).
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
        currency:
          type: string
          description: ISO 4217 code, e.g. "USD".
          minLength: 3
          maxLength: 3

    PaginatedResult:
      type: object
      description: |
        Cursor-paginated envelope. Concrete endpoints override `items` with their
        element type (OpenAPI has no generics — compose with `allOf` + an `items`
        override, or document the element type in the operation).
      required: [items]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null on the last page.
        total:
          type: integer
          nullable: true
          description: Total count when cheap to compute; otherwise omitted.

    TenantContext:
      type: object
      description: |
        Resolved tenant scope for the `/t/{tenant}/…` prefix [D-23]. Multi-tenancy
        is deferred to Phase 1; v1 runs single-tenant (`me`).
      required: [tenantId, slug]
      properties:
        tenantId:
          type: string
          format: uuid
        slug:
          type: string
        kind:
          type: string
          enum: [org, household]

    ContinuingItem:
      type: object
      description: |
        One "continue watching / reading / listening" entry for the cross-domain
        `/continue` rail [D-20]. Aggregated from each vertical's progress table.
      required: [module, id, title, progress, updatedAt]
      properties:
        module:
          type: string
          enum: [movie, music, story, comic]
        id:
          type: string
          format: uuid
        title:
          type: string
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Fractional completion 0..1.
        resourceUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
        updatedAt:
          type: string
          format: date-time
