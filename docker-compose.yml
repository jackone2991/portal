# Portal — local development compose.
# Production overlays should live in docker-compose.prod.yml.
#
# Bring up everything (incl. local MinIO storage):
#   docker compose up -d
# Infrastructure only:
#   docker compose up -d postgres pgbouncer dragonfly minio traefik
#
# Object storage:
#   - Dev (this file): MinIO, bytes live in the local folder ./data/minio. The app
#     speaks S3 to it, so going live = an .env change only — point S3_ENDPOINT +
#     S3_ACCESS_KEY/SECRET at R2/S3 and set S3_USE_PATH_STYLE=false. No code change.
#   - Prod overlay (docker-compose.prod.yml): drop MinIO, S3_* -> Cloudflare R2
#     (R2-only, per doc/en/architecture/04-storage-tier-budget.md).
#
# Login is local password auth (ADR-06) — Portal owns credentials, so there is
# no external IdP in the stack. (Historically this ran Authentik/OIDC; removed.)
#
# Dashboards:
#   https://traefik.${APP_DOMAIN}
#   https://minio.${APP_DOMAIN}     (MinIO console)
#
# New .env keys this file needs (see .env.example):
#   NEXT_PUBLIC_TEMPLATE_VERSION, NEXT_PUBLIC_API_BASE_URL, CORS_ALLOWED_ORIGINS
#
# Note: hostnames inside the compose network match service names below.

name: portal

networks:
  edge:        # external-facing: traefik <-> api/frontend
  internal:    # backend-only: db, cache, storage

volumes:
  postgres_data:
  traefik_acme:
  # MinIO uses a bind-mount (./data/minio), not a named volume — see the minio service.

services:
  # ── Reverse proxy ───────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - traefik_acme:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.${APP_DOMAIN}`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.tls.certresolver=${TRAEFIK_CERTRESOLVER-letsencrypt}
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
    networks: [edge]

  # ── Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: ${PGBOUNCER_POOL_MODE}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE}
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # ── Cache + queue broker ────────────────────────────────────────
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    ulimits:
      memlock: -1
    # Asynq's Lua scripts access keys dynamically (undeclared in KEYS[]), which
    # Dragonfly rejects by default. allow-undeclared-keys lets those scripts run
    # (Asynq is built for single-node Redis, which permits this).
    command: ["--logtostderr", "--default_lua_flags=allow-undeclared-keys"]
    healthcheck:
      # Dragonfly's image ships no redis-cli; a successful TCP connect to the
      # main port means it's up and accepting clients (bash is in the image).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6379"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [internal]

  # ── Object storage (dev: MinIO backed by the local folder ./data/minio) ──
  # Prod swaps S3_* to Cloudflare R2 and drops this service (see header / ADR-04).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      # Object-storage data dir. Default ./data/minio (repo-local, gitignored).
      # Override MINIO_DATA_DIR in .env to relocate — e.g. to a faster disk
      # (a dev box with MinIO on an HDD is ~5x slower than on an NVMe; the whole
      # media/transcode pipeline is bound by this write speed).
      - ${MINIO_DATA_DIR:-./data/minio}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio-console.rule=Host(`minio.${APP_DOMAIN}`)
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.tls=true
      - traefik.http.routers.minio-console.tls.certresolver=${TRAEFIK_CERTRESOLVER-letsencrypt}
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
    networks: [edge, internal]

  # One-shot: create the media bucket in MinIO so the first upload doesn't 404.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        echo "minio bucket ready: $${S3_BUCKET}"
    restart: "no"
    networks: [internal]

  # ── Mail (dev): Mailpit captures notify:email sends (SPEC-04 P0.3) ──
  # SMTP on :1025 (api/worker send here via SMTP_HOST=mailpit), web UI on :8025.
  # Prod points SMTP_* at a real relay/provider and drops this service.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailpit.rule=Host(`mail.${APP_DOMAIN}`)
      - traefik.http.routers.mailpit.entrypoints=websecure
      - traefik.http.routers.mailpit.tls=true
      - traefik.http.routers.mailpit.tls.certresolver=${TRAEFIK_CERTRESOLVER-letsencrypt}
      - traefik.http.services.mailpit.loadbalancer.server.port=8025
    networks: [edge, internal]

  # ── Application services ────────────────────────────────────────
  api:
    build:
      context: ./backend
      target: api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.${APP_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.routers.api.tls.certresolver=${TRAEFIK_CERTRESOLVER-letsencrypt}
      - traefik.http.services.api.loadbalancer.server.port=8080
    networks: [edge, internal]

  worker:
    build:
      context: ./backend
      target: worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at build time, so they
        # must be passed as build args (the Dockerfile should declare matching ARGs).
        # Switching template version = rebuild with a different value (see
        # frontend/src/templates/registry.ts).
        NEXT_PUBLIC_TEMPLATE_VERSION: ${NEXT_PUBLIC_TEMPLATE_VERSION:-v1}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.${APP_DOMAIN}}
        # Weather widget default location (see .env). If unset, weather falls back
        # to the browser geolocation prompt.
        NEXT_PUBLIC_WEATHER_LAT: ${NEXT_PUBLIC_WEATHER_LAT:-}
        NEXT_PUBLIC_WEATHER_LON: ${NEXT_PUBLIC_WEATHER_LON:-}
        NEXT_PUBLIC_WEATHER_PLACE: ${NEXT_PUBLIC_WEATHER_PLACE:-}
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=${TRAEFIK_CERTRESOLVER-letsencrypt}
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    networks: [edge]
