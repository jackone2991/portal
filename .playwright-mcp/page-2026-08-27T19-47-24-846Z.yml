    - generic [ref=f2e19]:
      - paragraph [ref=f2e20]: Portal — self-hosted media platform API.
      - paragraph [ref=f2e21]:
        - text: This document is the
        - strong [ref=f2e22]: source of truth
        - text: for the HTTP contract. Server stubs (Go) and the TypeScript client are both generated from it.
      - heading "Errors" [level=2] [ref=f2e23]
      - paragraph [ref=f2e24]:
        - text: Error responses use the
        - strong [ref=f2e25]: RFC 7807
        - code [ref=f2e26]: application/problem+json
        - text: shape (
        - code [ref=f2e27]: "#/components/schemas/Problem"
        - text: ), and that is the only error shape on the wire. The stable
        - code [ref=f2e28]: type
        - text: "URI is both the i18n key and the machine-stable slug: a domain code becomes"
        - code [ref=f2e29]: <module>/<code>
        - text: with underscores hyphenated (
        - code [ref=f2e30]: email_taken
        - text: →
        - code [ref=f2e31]: account/email-taken
        - text: ), which is what the frontend's problem catalog keys on. Transport-level codes that add nothing to the status line (
        - code [ref=f2e32]: unauthorized
        - text: ","
        - code [ref=f2e33]: forbidden
        - text: ","
        - code [ref=f2e34]: bad_request
        - text: ","
        - code [ref=f2e35]: internal
        - text: ","
        - code [ref=f2e36]: not_found
        - text: ) collapse to
        - code [ref=f2e37]: about:blank
        - text: .
      - blockquote [ref=f2e38]:
        - paragraph [ref=f2e39]:
          - strong [ref=f2e40]: "Migration status (v1):"
          - text: the RFC 7807 retrofit per [D-7]/[D-29] is
          - strong [ref=f2e41]: complete
          - text: — every handler, the auth/RBAC middleware, the rate limiter and the
          - code [ref=f2e42]: /continue
          - text: route now answer with
          - code [ref=f2e43]: Problem
          - text: . The legacy
          - code [ref=f2e44]: "{code, message}"
          - text: body (
          - code [ref=f2e45]: "#/components/schemas/Error"
          - text: ) is emitted nowhere and referenced by no operation; the schema is kept
          - code [ref=f2e46]: deprecated
          - text: so a generated client that still names the type keeps compiling, and should be dropped at the next breaking release.
      - paragraph [ref=f2e47]:
        - text: Auth is
        - strong [ref=f2e48]: local password
        - text: (
        - link "ADR-06" [ref=f2e49] [cursor=pointer]:
          - /url: ../docs/adr/06-local-auth-model.md
        - text: ); the OIDC/Authentik login +
        - code [ref=f2e50]: /auth/callback
        - text: flow was removed.
