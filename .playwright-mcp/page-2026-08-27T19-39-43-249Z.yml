      - heading "Errors" [level=2] [ref=f1e23]
      - paragraph [ref=f1e24]:
        - text: Error responses use the
        - strong [ref=f1e25]: RFC 7807
        - code [ref=f1e26]: application/problem+json
        - text: shape (
        - code [ref=f1e27]: "#/components/schemas/Problem"
        - text: ). The stable
        - code [ref=f1e28]: type
        - text: URI doubles as the i18n key; the
        - code [ref=f1e29]: code
        - text: extension is a machine-stable slug (e.g.
        - code [ref=f1e30]: invalid_credentials
        - text: ).
      - blockquote [ref=f1e31]:
        - paragraph [ref=f1e32]:
          - strong [ref=f1e33]: "Migration note (v1):"
          - text: RFC 7807 is the target contract per [D-7]/[D-29]. Some handlers still emit the legacy
          - code [ref=f1e34]: "{code, message}"
          - text: body (
          - code [ref=f1e35]: "#/components/schemas/Error"
          - text: ); they are retrofitted to
          - code [ref=f1e36]: Problem
          - text: as they are touched, not in a sweep (see ADR-01). Treat
          - code [ref=f1e37]: Problem
          - text: as authoritative.
      - paragraph [ref=f1e38]:
        - text: Auth is
        - strong [ref=f1e39]: local password
        - text: (
        - link "ADR-06" [ref=f1e40] [cursor=pointer]:
