version: "2"

# One block per module. Each block reads ALL migrations as schema (so it
# knows the full DB shape) but only generates from its own queries —
# repository code stays inside the module's tree.
#
# Convention: package name = `<module>repo` (e.g. accountrepo, mediarepo)
# to make import paths self-documenting at call sites.
#
# NOTE (v1): only the `account` block is active. The tenant/media/movie/music/
# story/comic modules have no query files yet, and `media` needs the deferred
# `assets` table (see MILESTONE_CHECKS.md T5.1). Their blocks stay commented out
# so `sqlc generate` is green. Re-enable a block when its module gains queries.

sql:
  - engine: "postgresql"
    queries: "internal/modules/account/query"
    schema:  "db/migrations"
    gen:
      go:
        package: "accountrepo"
        out:     "internal/modules/account/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_pointers_for_null_types: true

  # media — assets table (0007). Active for the v1 upload → transcode → playback slice.
  - engine: "postgresql"
    queries: "internal/modules/media/query"
    schema:  "db/migrations"
    gen:
      go:
        package: "mediarepo"
        out:     "internal/modules/media/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_pointers_for_null_types: true

  # notify — notifications / preferences / web-push tables (0009). SPEC-04.
  - engine: "postgresql"
    queries: "internal/modules/notify/query"
    schema:  "db/migrations"
    gen:
      go:
        package: "notifyrepo"
        out:     "internal/modules/notify/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_pointers_for_null_types: true

  # journal — journal_entries table (0011). SPEC-05 (life-stream write path).
  - engine: "postgresql"
    queries: "internal/modules/journal/query"
    schema:  "db/migrations"
    gen:
      go:
        package: "journalrepo"
        out:     "internal/modules/journal/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_pointers_for_null_types: true

  # ops — ops_backup_runs ledger (0012). SPEC-09 P0 (backups + freshness sentinel).
  - engine: "postgresql"
    queries: "internal/modules/ops/query"
    schema:  "db/migrations"
    gen:
      go:
        package: "opsrepo"
        out:     "internal/modules/ops/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_pointers_for_null_types: true

  # ── Re-enable per module when it has query files ──────────────────
  # - engine: "postgresql"
  #   queries: "internal/modules/tenant/query"
  #   schema:  "db/migrations"
  #   gen: { go: { package: "tenantrepo", out: "internal/modules/tenant/repository", sql_package: "pgx/v5", emit_json_tags: true, emit_interface: true, emit_pointers_for_null_types: true } }
  #
  # - movie / music / story / comic: same shape as above.
