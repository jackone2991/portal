# Authentik blueprint — declaratively provisions the Portal OIDC provider +
# application on first boot (and reconciles on change). Mounted into the
# authentik server + worker at /blueprints/custom/ by docker-compose.override.yml.
#
# client_id / client_secret here MUST match OIDC_CLIENT_ID / OIDC_CLIENT_SECRET
# in .env. This is a LOCAL DEV secret — rotate for anything real.
version: 1
metadata:
  name: Portal OIDC provider
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: portal-provider
    identifiers:
      name: Portal
    attrs:
      name: Portal
      client_type: confidential
      client_id: portal
      client_secret: portal-oidc-dev-secret-4f3a9b2c8e1d
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://api.portal.localhost/api/v1/auth/callback
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    identifiers:
      slug: portal
    attrs:
      name: Portal
      slug: portal
      provider: !KeyOf portal-provider
