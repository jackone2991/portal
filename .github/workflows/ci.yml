name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are wasted minutes; a main build is the record of what
  # shipped, so let it finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    # The job name is a required status check on `main` (branch protection keys
    # on it). Rename it here and every PR is blocked until the rule is updated.
    name: Backend (sqlc · build · vet · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The RLS isolation suite (platform/db/rls*_test.go) is the only proof that
    # tenant B cannot read tenant A's rows on the portal_app role — a claim about
    # PostgreSQL policy evaluation that no in-memory fake can model. So the job
    # gets a throwaway Postgres, built from nothing but db/migrations; that also
    # proves the migration chain applies from zero, which the deployment (only
    # ever applying the newest file) never re-checks. Same major as the host
    # cluster the deployment runs on.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: portal
        ports:
          - 5432:5432
        # -h forces TCP: the image's temporary initdb server answers on the
        # unix socket too, and "healthy" must mean the real one.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U portal -d portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `portal` owns the schema (superuser): applies migrations, seeds fixtures.
      # `portal_app` is what migration 0019 creates — NOSUPERUSER NOBYPASSRLS,
      # with the placeholder password .env.example ships — and rls_test.go's
      # role probe refuses anything that could bypass RLS, so the suite cannot
      # pass vacuously against the owner.
      RLS_TEST_ADMIN_URL: postgres://portal:change-me@127.0.0.1:5432/portal?sslmode=disable
      RLS_TEST_APP_URL: postgres://portal_app:change-me-portal-app@127.0.0.1:5432/portal?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so CI cannot drift from the toolchain the
          # code declares. A hardcoded value behind go.mod makes every run pay for
          # an on-the-fly `go: downloading go1.X` toolchain fetch.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # sqlc output (internal/modules/*/repository/*.sql.go) is NOT committed —
      # .gitignore excludes it — but the committed adapter.go/querier.go call into
      # it, so nothing compiles until it exists. This step must precede the build.
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"

      - name: Generate repositories from queries
        run: sqlc generate

      # Same tool `make migrate` wraps, pinned. The postgres driver is a build
      # tag, not a default — without it the binary knows no databases.
      - name: Install golang-migrate
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1
      - name: Apply every migration to the throwaway database
        run: migrate -path db/migrations -database "$RLS_TEST_ADMIN_URL" up

      - name: Build + vet + test
        # The RLS suite is pointed (env above) and, because CI=true, refuses to
        # skip if it ever finds itself unpointed. platform/storage (S3_ENDPOINT)
        # still skips itself — there is no object store here.
        run: |
          go build ./...
          go vet ./...
          go test ./... -race -count=1

  lint:
    name: Backend lint (module boundaries · depguard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # depguard type-checks the packages it inspects, so it needs the generated
      # repositories for the same reason the build does.
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: Generate repositories from queries
        run: sqlc generate

      # Bump the version if the install step ever fails (any recent v2.x is fine).
      - name: Install golangci-lint (v2)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.0.2
      - name: Enforce module boundaries
        run: golangci-lint run ./...

  openapi:
    name: OpenAPI contract (parse + codegen drift gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared/openapi.yaml parses
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          doc = yaml.safe_load(open("shared/openapi.yaml"))
          assert isinstance(doc, dict), "openapi.yaml is not a mapping"
          for key in ("openapi", "info", "paths"):
              assert key in doc, f"missing top-level key: {key}"
          print("openapi.yaml OK —", doc["openapi"], "·", len(doc["paths"]), "paths")
          PY
      # ADR-10: the committed codegen (Go server stubs + TS client types) must
      # match the spec. Regenerate and fail on any diff.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install codegen tools
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.2
          cd frontend && pnpm install --frozen-lockfile
      - name: Regenerate from spec
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          make openapi
      - name: Fail on drift
        run: |
          git diff --exit-code -- \
            backend/internal/handler/api.gen.go \
            frontend/src/lib/types.gen.ts \
          || { echo "::error::OpenAPI codegen is stale — run 'make openapi' and commit the result."; exit 1; }

  frontend:
    name: Frontend (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.portal.localhost
      NEXT_PUBLIC_TEMPLATE_VERSION: v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # `next build` type-checks too, but as its own step the failure says which
      # of the two broke. No lint step: the repo has no ESLint config, so
      # `next lint` / next's build-time lint pass are both no-ops today.
      - name: Typecheck
        run: pnpm typecheck
      # vitest over src/**/*.test.ts (vitest.config.ts) — the pure rules the
      # SPEC-12 composer and card are built on. Its own step for the same
      # reason typecheck is. The display name does not list it: see the note on
      # the `backend` job about branch protection and job names.
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  # ADR-11: a rule that is not checked is a rule that will be broken again.
  # Its own job, not a step inside `lint` — that job is Go-only and needs sqlc
  # + golangci-lint before it can say anything; a docs PR should not wait on
  # (or be failed by) the Go toolchain. Blocking: a broken relative link is a
  # build failure, same as stale codegen.
  link-check:
    name: Docs (links · status headers · retired names · matrix evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every relative Markdown link
        run: bash scripts/check-links.sh
      # STYLE.md: every document under docs/ opens with a status header whose
      # `Last verified` is a date or the literal `never`. Presence only.
      - name: Check every docs/ document has a status header
        run: bash scripts/check-doc-headers.sh
      # The link checker cannot see a prose mention of a deleted file. A deny-
      # list of retired names, allowed only with a retirement cue on the line.
      - name: Check no retired name is cited as if it still existed
        run: bash scripts/check-retired-names.sh
      # Every `file_test.go: TestX` in the traceability matrix must resolve, and
      # every ✅ row must name its proof. Presence, not sufficiency.
      - name: Check the traceability matrix names tests that exist
        run: python3 scripts/check-matrix-evidence.py
