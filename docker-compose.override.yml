# Local-development overrides — auto-merged by `docker compose` (NOT used in prod;
# prod overlays go in docker-compose.prod.yml). Wires locally-trusted TLS so the
# app is reachable over https://*.portal.localhost.
#
# Login is local password auth (ADR-06): no IdP, so no OIDC blueprint mounts and
# no SSL_CERT_FILE trust hack (the API no longer makes outbound TLS calls to an IdP).
#
# One-time setup:
#   1) make certs (or the openssl self-signed fallback)   # trusted local cert
#   2) TRAEFIK_CERTRESOLVER= (empty) in .env               # routers use that cert
#   3) hosts (127.0.0.1): portal / api / minio / traefik .portal.localhost
services:
  traefik:
    volumes:
      - ./certs:/certs:ro
      - ./traefik/dynamic.dev.yml:/etc/traefik/dynamic/tls-local.yml:ro
  # Expose MinIO's S3 port to the host so a HOST-run comic scraper (P1.8, needed to
  # bypass Cloudflare with real Chrome) can upload the zip at http://localhost:9000.
  minio:
    ports:
      - "9000:9000"
  # Expose the api's HTTP port to the host so a HOST-run scraper can hit the
  # sync-callback without needing *.portal.localhost DNS (Python won't resolve it).
  api:
    ports:
      - "8080:8080"
  # Expose the Next.js frontend to the host so a phone on the LAN can open the app
  # at http://<this-machine-LAN-IP>:3000 (Traefik's *.portal.localhost host rules +
  # local CA don't resolve/trust on a phone). The api-client derives the API base
  # from window.location, so :3000 talks to :8080 of the same host automatically.
  frontend:
    ports:
      - "3000:3000"
